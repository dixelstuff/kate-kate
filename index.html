<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deadloch Trivia Crammer</title>
<style>

:root{
  --bg:#172234;
  --card:#edf3f8;
  --ink:#172234;
  --muted:#5f6f80;
  --line:#c7d5e2;
  --soft:#f7fafc;
  --answerBg:#ffffff;
  --green:#38a86b;
  --amber:#e2ad2f;
  --red:#d45266;
  --blue:#dcefff;
  --blueText:#28566d;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{height:100dvh;overflow:hidden}
.hidden{display:none!important}

#startScreen{display:flex;align-items:center;justify-content:center;padding:24px}
.startWrap{width:min(520px,100%)}
h1{margin:0 0 9px;color:#f2f6fb;font-size:2.2rem;line-height:.98;letter-spacing:-.03em;font-weight:800}
.startSub{color:#c7d5e2;font-size:.95rem;margin-bottom:24px}
.namegrid{display:grid;grid-template-columns:1fr;gap:10px}
.namebtn{
  width:100%;border:1px solid #b6c7d7;background:#f8fbfd;color:var(--ink);
  border-radius:16px;padding:16px;font-size:1.12rem;font-weight:800;text-align:left
}
.namebtn:active{transform:scale(.995)}

#studyScreen{
  height:100dvh;overflow:hidden;max-width:560px;margin:0 auto;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-rows:auto 5px minmax(0,1fr) auto;gap:9px
}
.topbar{
  min-height:34px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px
}
.playerName{
  color:#d9e5f2;
  font-size:.88rem;
  font-weight:800;
  justify-self:start
}
.todo{
  color:#ffd44f;
  font-size:.88rem;
  font-weight:850;
  white-space:nowrap;
  justify-self:center
}
.topright{
  display:flex;
  align-items:center;
  gap:10px;
  justify-self:end
}
.toggleWrap{
  color:#d9e5f2;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:.82rem;
  white-space:nowrap
}
.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#5d6875;border-radius:999px;transition:.15s}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .slider{background:#dcefff}
.switch input:checked + .slider:before{transform:translateX(18px);background:#28566d}

.progress{height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.13)}
.progress div{height:100%;background:#3f6f9d;width:0}

.card{
  min-height:0;height:100%;overflow:hidden;background:var(--card);
  border:1px solid rgba(255,255,255,.30);border-radius:20px;padding:16px;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  box-shadow:0 8px 24px rgba(3,12,25,.20)
}
.meta{min-height:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#metaSeason{
  display:inline-block;color:#28566d;background:rgba(220,239,255,.45);
  border:1px solid #9fbfd2;border-radius:999px;padding:5px 8px;
  font-size:.72rem;font-weight:800
}
.owners{color:#647586;font-size:.73rem;letter-spacing:0;padding-top:4px}
.cardScroll{
  min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-right:2px;scrollbar-width:thin
}
.q{
  margin:20px 0 16px;color:var(--ink);font-size:1.55rem;line-height:1.26;
  font-weight:700;letter-spacing:-.015em
}
.face{
  height:250px;border-radius:15px;overflow:hidden;background:#dfe7ee;
  margin:10px 0 16px;display:flex;align-items:center;justify-content:center
}
.face img{width:100%;height:100%;object-fit:cover}

.answerWrap{
  background:var(--answerBg);border:1px solid #d6e0e9;border-radius:16px;
  padding:15px;margin-top:14px;margin-bottom:8px
}
.label{
  color:#6b7885;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.09em;font-weight:850
}
.answer{margin:6px 0 11px;color:var(--ink);font-size:1.35rem;line-height:1.3;font-weight:800}
.context{color:#4f5d6b;font-size:1rem;line-height:1.46}
.cardActions{padding-top:10px}
.reveal{
  width:100%;height:46px;border:1px solid #a9c6d9;border-radius:15px;
  background:var(--blue);color:var(--blueText);font-weight:850
}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{
  height:46px;border:0;border-radius:15px;padding:0 6px;
  color:#fff;font-size:.96rem;font-weight:850
}
.miss{background:var(--red)}
.shaky{background:var(--amber);color:#172234}
.good{background:var(--green)}

.undoRow{
  min-height:30px;
  display:flex;
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:2px;
  padding-bottom:8px
}
.undoBtn{
  border:0;background:transparent;color:#aebdcb;font-size:.76rem;padding:4px 0;
  text-decoration:underline;text-underline-offset:2px
}
.undoBtn:disabled{opacity:.35;text-decoration:none;cursor:default}

.done{
  min-height:0;height:100%;background:var(--card);border:1px solid rgba(255,255,255,.30);
  border-radius:20px;padding:28px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--ink)
}
.done b{font-size:2.2rem;color:var(--green);display:block;margin-bottom:8px}
.done p{color:var(--muted);max-width:380px;line-height:1.5}
.done button{
  margin-top:12px;border:1px solid #b6c7d7;background:#f8fbfd;color:#28566d;
  border-radius:14px;padding:11px 14px;font-weight:800
}

@media(max-width:560px){
  #studyScreen{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .topright{gap:7px}
  .topbar{grid-template-columns:1fr auto 1fr}
  .toggleWrap{font-size:.78rem}
  .q{font-size:1.42rem}
  .answer{font-size:1.25rem}
  .context{font-size:.96rem}
  .face{height:220px}
  .reveal,.rate{height:44px}
}

</style>
</head>
<body>

<div id="startScreen" class="screen">
  <div class="startWrap">
    <h1>DEADLOCH<br>TRIVIA CRAMMER</h1>
    <div class="startSub">Who are you?</div>
    <div class="namegrid">
      <button class="namebtn" data-player="Andrew">Andrew</button>
      <button class="namebtn" data-player="Bel">Bel</button>
      <button class="namebtn" data-player="Andy">Andy</button>
    </div>
  </div>
</div>

<div id="studyScreen" class="screen hidden">
  <div class="topbar">
    <div class="playerName" id="playerName"></div>
    <div class="todo" id="todo">150 to go</div>
    <div class="topright">
      <label class="toggleWrap">
        <span>Solo only</span>
        <span class="switch">
          <input type="checkbox" id="soloToggle">
          <span class="slider"></span>
        </span>
      </label>
    </div>
  </div>

  <div class="progress"><div id="prog"></div></div>

  <div id="card" class="card">
    <div class="meta">
      <span id="metaSeason"></span>
      <span class="owners" id="owners"></span>
    </div>
    <div class="cardScroll" id="cardScroll">
      <div id="face" class="face hidden"><img id="img" alt="Deadloch character"></div>
      <div class="q" id="q"></div>
      <div id="answerWrap" class="answerWrap hidden">
        <div class="label">ANSWER</div>
        <div class="answer" id="answer"></div>
        <div class="label">CONTEXT</div>
        <div class="context" id="context"></div>
      </div>
    </div>
    <div class="cardActions">
      <button class="reveal" id="reveal">Reveal answer</button>
      <div class="rates hidden" id="rates">
        <button class="rate miss" data-rate="missed">Missed</button>
        <button class="rate shaky" data-rate="shaky">Shaky</button>
        <button class="rate good" data-rate="know">Know it</button>
      </div>
    </div>
  </div>

  <div id="done" class="done hidden">
    <b>0 to go</b>
    <p id="doneText">You have marked every active card as Know.</p>
    <button id="switchPlayer">Switch player</button>
  </div>
  <div class="undoRow"><button id="undo" class="undoBtn" disabled>Undo last</button></div>
</div>

<script>
const ALL=[{"id": "c01", "q": "Who plays Dulcie Collins?", "answer": "Kate Box.", "context": "Dulcie is Deadloch’s senior police officer and one half of the central partnership with Eddie. She is married to Cath York.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1–S2", "kind": "fact", "image": ""}, {"id": "c02", "q": "Who plays Eddie Redcliffe?", "answer": "Madeleine Sami.", "context": "Eddie is the Darwin detective who arrives in Deadloch in Season 1 and later drives much of the Season 2 story through her history with Bushy, Frank and Barra Creek.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1–S2", "kind": "fact", "image": ""}, {"id": "c03", "q": "Who plays Abby Matsuda?", "answer": "Nina Oyama.", "context": "Abby starts as the junior constable but repeatedly supplies crucial investigative insights and becomes one of the core trio.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1–S2", "kind": "fact", "image": ""}, {"id": "c04", "q": "Who plays Cath York?", "answer": "Alicia Gardiner.", "context": "Cath is Dulcie’s wife and a vet. Her veterinary access becomes important because Ray obtains pentobarbital through her.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1–S2", "kind": "fact", "image": ""}, {"id": "c05", "q": "Who plays Aleyna Rahme?", "answer": "Susie Youssef.", "context": "Aleyna is Deadloch’s mayor and remains obsessed with keeping the Winter Feastival functioning even as the murder count rises.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c06", "q": "Who plays Skye O’Dwyer?", "answer": "Holly Austin.", "context": "Skye is Sam and Victoria O’Dwyer’s daughter, Nadiyah’s wife and Tom’s parent. She becomes an important suspect and link to the past.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c07", "q": "Who plays Margaret Carruthers?", "answer": "Pamela Rabe.", "context": "Margaret is the powerful Carruthers matriarch. Her separate involvement in William Carruthers’ death runs alongside Ray’s serial-killer plot.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c08", "q": "Who plays Vanessa Latham?", "answer": "Katie Robertson.", "context": "Vanessa is Trent’s wife. Her nickname, Nessie, becomes a major clue because Sam’s boat is called Loch Nessie.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c09", "q": "Who plays Ray McLintock?", "answer": "Duncan Fellows.", "context": "Ray seems like an odd but peripheral local for much of the season before being revealed as the Season 1 serial killer.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c10", "q": "Who plays Frank McCallister?", "answer": "Steve Bisley.", "context": "Frank is Eddie’s father in Season 2 and owns Triple Pet, one of the season’s most memorable crocodiles.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c11", "q": "Who plays Miki Evans?", "answer": "Shari Sebbens.", "context": "Miki is one of the major Season 2 additions and becomes Eddie’s romantic partner by the end.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c12", "q": "Who plays Leo Lee?", "answer": "Jean Tong.", "context": "Leo becomes important to Abby’s Season 2 story. Jean Tong is primarily known as a writer/director and Deadloch is their acting debut.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c13", "q": "Who plays Jason Wade?", "answer": "Luke Hemsworth.", "context": "Jason is the celebrity adventurer tied to the Season 2 illegal crocodile-hunting plot.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c14", "q": "Who is Dulcie married to?", "answer": "Cath York.", "context": "Their marriage, Dulcie’s work obsession and the history of Dulcie’s affair are recurring emotional threads across the series.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1–S2", "kind": "fact", "image": ""}, {"id": "c15", "q": "Who is Skye married to?", "answer": "Nadiyah Zammit.", "context": "Nadiyah is part of the newer Deadloch community and co-parents Tom with Skye.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c16", "q": "What is Vanessa Latham’s nickname?", "answer": "Nessie.", "context": "That nickname is the key to understanding why Sam O’Dwyer’s boat is named Loch Nessie.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c17", "q": "Who is Frank McCallister?", "answer": "Eddie Redcliffe’s father.", "context": "Their strained relationship gives Season 2 much of its emotional and investigative complexity.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c18", "q": "What is Bushy’s surname?", "answer": "Bushman.", "context": "Bushy is Eddie’s former police partner. His death is the reason Dulcie and Eddie head north in Season 2.", "owners": ["Andrew", "Bel", "Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "c19", "q": "Who is the first body discovered in Deadloch?", "answer": "Trent Latham.", "context": "Trent’s naked body is found on Deadloch Beach at the start of Season 1, kicking off the murder investigation.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c20", "q": "Who discovers Trent Latham’s body?", "answer": "Tammy Hampson and Miranda Hoskins.", "context": "The two teenagers find him on the beach before the Feastival, making them the first witnesses in the series’ central case.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c21", "q": "Who is Ray McLintock’s first chronological victim?", "answer": "Sam O’Dwyer.", "context": "Sam disappeared years before Trent’s body is found. The investigation later realises Sam was Ray’s first murder, even though Trent is the first body we see.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c22", "q": "Who is the Season 1 serial killer?", "answer": "Ray McLintock.", "context": "Ray targets men who have histories of abusing women and ultimately kidnaps several local men in the finale.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c23", "q": "What connects Ray’s victims?", "answer": "They are men with histories of abusing women.", "context": "This pattern only becomes clear after the frozen bodies are identified and their histories are compared.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c24", "q": "What body part does Ray remove from his victims?", "answer": "Their tongues.", "context": "Tongue removal becomes one of the signature features linking the murders.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c25", "q": "What is Ray’s main killing method?", "answer": "Strangulation.", "context": "The tongue removal is the signature mutilation, while strangulation is the primary cause of death.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c26", "q": "What sedative is found in Ray’s later victims?", "answer": "Pentobarbital.", "context": "The drug points investigators toward veterinary and medical access and eventually back to Cath and Ray’s donkey story.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c27", "q": "Which early victim was NOT given pentobarbital?", "answer": "Sam O’Dwyer.", "context": "Sam’s death is different from Ray’s later, more methodical murders, helping establish him as the first chronological victim.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c28", "q": "What is Sam O’Dwyer’s boat called?", "answer": "Loch Nessie.", "context": "The boat’s name turns out to reference Vanessa ‘Nessie’ Latham and becomes both a relationship clue and a forensic clue.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c29", "q": "Who was Loch Nessie named after?", "answer": "Vanessa ‘Nessie’ Latham.", "context": "Sam named the boat after Vanessa, exposing the hidden relationship he had with her when she was a teenager.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c30", "q": "Who is Dolph Latham’s biological father?", "answer": "Sam O’Dwyer.", "context": "The late Season 1 reveal shows Dolph is Sam’s son rather than Trent’s, deepening the Vanessa/Sam backstory.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c31", "q": "What object supplies the treated-timber clue?", "answer": "Jimmy Cook’s crucifix.", "context": "Abby realises the wood is CCA-treated timber, which links the crucifix to boat timber and ultimately Loch Nessie.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c32", "q": "Which chemical clue is associated with the treated timber?", "answer": "Arsine.", "context": "The treated wood produces an arsenic-related clue and a distinctive garlic smell when burned.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c33", "q": "What smell is associated with the treated timber clue?", "answer": "Garlic.", "context": "That odd smell helps Abby connect burned treated timber to the boat evidence.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c34", "q": "Why did the lake bodies look unexpectedly fresh?", "answer": "They had been frozen and later thawed.", "context": "A second pathologist recognises the cellular damage, revealing that the victims could have been killed over several years.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c35", "q": "What did the frozen-body discovery reveal about the murders?", "answer": "They had happened over a period of years.", "context": "That finding lets the team connect older missing men to the same killer and identify the abusive-men pattern.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c36", "q": "Who survives Ray despite having his tongue removed?", "answer": "Phil McGangus.", "context": "Phil is abducted and mutilated but survives, making him a memorable exception among Ray’s intended victims.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c37", "q": "How did Ray get access to pentobarbital?", "answer": "From Cath, supposedly for his donkey.", "context": "The donkey is seeded very early in the season as an innocuous veterinary detail and later becomes a crucial callback.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c38", "q": "Who killed William Carruthers?", "answer": "Margaret Carruthers.", "context": "William’s death is a separate crime from Ray’s serial murders and is tied to Carruthers land and family history.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c39", "q": "What major object helps expose William Carruthers’ fate?", "answer": "His submerged car.", "context": "The car opens the parallel Carruthers murder thread and links to other evidence including Victoria O’Dwyer’s shoe.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c40", "q": "Whose shoe becomes important in the William Carruthers evidence?", "answer": "Victoria O’Dwyer’s.", "context": "The shoe is associated with the submerged car and helps unravel Margaret’s separate crime.", "owners": ["Andrew", "Bel", "Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "c41", "q": "Wha kind": "fact", "image": ""}, {"id": "andy28", "q": "What is Kevin?", "answer": "The troublesome Deadloch harbour seal.", "context": "Kevin causes enough problems that Aleyna wants him euthanised.", "owners": ["Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy29", "q": "What is Felicia?", "answer": "An animal patient Cath is inseminating.", "context": "The dialogue briefly makes this sound much stranger than it is.", "owners": ["Andrew"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy30", "q": "What did Vanessa and Trent supposedly eat during her alibi?", "answer": "Tuna mornay.", "context": "Vanessa says they ate tuna mornay, watched Ninja Warrior, went to bed and had sex.", "owners": ["Bel"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy31", "q": "What TV show did Vanessa say they watched?", "answer": "Ninja Warrior.", "context": "Part of the deliberately mundane Latham alibi.", "owners": ["Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy32", "q": "What gets mixed into the ‘big-boy powder’?", "answer": "Strawberry jelly crystals and pet-grade powdered milk.", "context": "The product is one of the show’s grotesque small-town-business jokes.", "owners": ["Andrew"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy33", "q": "What Feastival food is made from tripe?", "answer": "Tripe wafers.", "context": "They appear at Beast On The Cross.", "owners": ["Bel"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy34", "q": "What airport drink is mentioned in Season 2?", "answer": "A fishbowl margarita.", "context": "Part of Eddie’s Darwin/airport anecdote.", "owners": ["Andy"], "season": "S2", "kind": "fact", "image": ""}, {"id": "andy35", "q": "What did Eddie’s vomit taste like in the Bushy-night recollection?", "answer": "Bananas.", "context": "Sprog then licks it, making the memory both disgusting and memorable.", "owners": ["Andrew"], "season": "S2", "kind": "fact", "image": ""}, {"id": "andy36", "q": "Which song is misintroduced on Pink Flag as the Indigo Girls?", "answer": "Cherry Bomb by The Runaways.", "context": "The wrong introduction is part of the opening-radio comedy.", "owners": ["Bel"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy37", "q": "What Tori Amos song is associated with Cath?", "answer": "Cornflake Girl.", "context": "Cath sings or references it in Season 1.", "owners": ["Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy38", "q": "What Dave Dobbyn song is requested on the radio in the S2 finale?", "answer": "Slice of Heaven.", "context": "It plays into the emotional ending and later gets a Pete Murray cover gag.", "owners": ["Andrew"], "season": "S2", "kind": "fact", "image": ""}, {"id": "andy39", "q": "Which singer’s cover of Slice of Heaven becomes a later joke?", "answer": "Pete Murray.", "context": "A second-layer music gag in the finale.", "owners": ["Bel"], "season": "S2", "kind": "fact", "image": ""}, {"id": "andy40", "q": "Why did Kate McLennan initially think Broadchurch might be funny?", "answer": "Because Olivia Colman was in it.", "context": "That misunderstanding is part of the creators’ repeated origin story for Deadloch.", "owners": ["Andy"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy41", "q": "Which Victorian town is connected to the name Deadloch?", "answer": "Mortlake.", "context": "Kate McLennan’s home-town connection feeds the show’s name.", "owners": ["Andrew"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy42", "q": "What odd Mortlake fact is part of the naming anecdote?", "answer": "It did not have a lake until one was constructed in 1988.", "context": "A wonderfully specific creator-history detail.", "owners": ["Bel"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy43", "q": "What real building doubles for the Deadloch Police Station exterior?", "answer": "Carmel Hall, Cygnet.", "context": "One of the strongest real-location mappings from Season 1.", "owners": ["Andy"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy44", "q": "What real building doubles for Bush Wolf?", "answer": "Cygnet Old Bank.", "context": "Another good Cygnet transformation to recognise.", "owners": ["Andrew"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy45", "q": "What real venue doubles for Devil’s Doorbell?", "answer": "Thirsty Camel, Cygnet.", "context": "A direct real-business-to-fictional-business mapping.", "owners": ["Bel"], "season": "S1", "kind": "fact", "image": ""}, {"id": "andy46", "q": "What phrase describes Season 1’s visual style?", "answer": "Tassie Noir.", "context": "The creators/marketing often frame Season 1 this way.", "owners": ["Andy"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy47", "q": "What phrase describes Season 2’s visual shift?", "answer": "Tropical Gothic.", "context": "Season 2 deliberately moves from Tasmania’s cool noir palette to Top End heat and colour.", "owners": ["Andrew"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy48", "q": "How many crocodile tours did the Kates do in one day on their Top End research trip?", "answer": "Three.", "context": "The creators have described cramming multiple croc tours into one research day.", "owners": ["Bel"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy49", "q": "What real Darwin attraction inspired the Kates’ ‘Tube of Doom’ terminology?", "answer": "The Cage of Death.", "context": "They tried to book the real attraction during research.", "owners": ["Andy"], "season": "General", "kind": "fact", "image": ""}, {"id": "andy50", "q": "Why didn’t the Kates actually do their booked Cage of Death experience?", "answer": "It had been booked for the wrong month.", "context": "A very creator-hosted-trivia kind of anecdote.", "owners": ["Andrew"], "season": "General", "kind": "fact", "image": ""}];
let player=null, soloOnly=false, queue=[], idx=0, revealed=false, undoStack=[];

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function key(){ return 'deadloch_simple_'+player; }
function load(){
  if(!player) return {ratings:{}};
  const x=localStorage.getItem(key());
  return x ? JSON.parse(x) : {ratings:{}};
}
function save(x){ localStorage.setItem(key(),JSON.stringify(x)); }
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function eligible(c){
  if(!c.owners.includes(player)) return false;
  if(soloOnly && c.owners.length!==1) return false;
  return true;
}
function isKnown(c){
  const r=load().ratings[c.id];
  return r && r.rating==='know';
}
function activeCards(){ return ALL.filter(c=>eligible(c)); }
function remainingCards(){ return activeCards().filter(c=>!isKnown(c)); }
function updateTodo(){
  const all=activeCards(), rem=remainingCards();
  $('#todo').textContent=`${rem.length} to go`;
  const known=all.length-rem.length;
  $('#prog').style.width=all.length?`${(known/all.length)*100}%`:'0%';
}
function ownersIcons(c){ return '👤'.repeat(c.owners.length); }

function buildQueue(){
  queue=shuffle(remainingCards().slice());
  idx=0;
  revealed=false;
  render();
}

function render(){
  updateTodo();
  const rem=remainingCards();
  if(rem.length===0){
    $('#card').classList.add('hidden');
    $('#done').classList.remove('hidden');
    $('#doneText').textContent = soloOnly
      ? 'You have marked every solo card as Know.'
      : 'You have marked every card in your deck as Know.';
    return;
  }
  $('#card').classList.remove('hidden');
  $('#done').classList.add('hidden');
  $('#undo').disabled = undoStack.length===0;

  // If current queue exhausted or current card became ineligible/known, refresh.
  if(!queue.length || idx>=queue.length){
    queue=shuffle(rem.slice()); idx=0;
  }
  let c=queue[idx];
  if(!c || !eligible(c) || isKnown(c)){
    queue=shuffle(rem.slice()); idx=0; c=queue[0];
  }

  $('#q').textContent=c.q;
  $('#answer').textContent=c.answer;
  $('#context').textContent=c.context;
  $('#metaSeason').textContent=c.season||'';
  $('#owners').textContent=ownersIcons(c);
  $('#answerWrap').classList.toggle('hidden',!revealed);
  $('#reveal').classList.toggle('hidden',revealed);
  $('#rates').classList.toggle('hidden',!revealed);

  const sc=$('#cardScroll'); if(sc) sc.scrollTop=0;
  if(c.image){
    $('#face').classList.remove('hidden');
    const im=$('#img');
    im.src=c.image;
    im.style.objectPosition=c.imagePosition || '50% 50%';
    im.style.transform=c.imageScale ? `scale(${c.imageScale})` : 'none';
    im.onerror=()=>$('#face').classList.add('hidden');
  } else $('#face').classList.add('hidden');
}

function currentCard(){ return queue[idx]; }

function rate(r){
  const c=currentCard(); if(!c) return;
  const s=load();
  const previous = s.ratings[c.id] ? {...s.ratings[c.id]} : null;

  // Save enough state to reverse this action.
  undoStack.push({
    cardId:c.id,
    previousRating:previous,
    queueIds:queue.map(x=>x.id),
    idx:idx
  });

  const old=s.ratings[c.id]||{seen:0};
  s.ratings[c.id]={rating:r,seen:(old.seen||0)+1,ts:Date.now()};
  save(s);

  if(r==='know'){
    queue.splice(idx,1);
    if(idx>=queue.length) idx=0;
  } else {
    queue.splice(idx,1);
    const gap = r==='missed' ? 7+Math.floor(Math.random()*4) : 16+Math.floor(Math.random()*9);
    const pos=Math.min(queue.length, idx+gap);
    queue.splice(pos,0,c);
    if(idx>=queue.length) idx=0;
  }
  revealed=false;
  render();
}

function undoLast(){
  const u=undoStack.pop();
  if(!u) return;

  const s=load();
  if(u.previousRating) s.ratings[u.cardId]=u.previousRating;
  else delete s.ratings[u.cardId];
  save(s);

  const byId=Object.fromEntries(ALL.map(c=>[c.id,c]));
  queue=u.queueIds.map(id=>byId[id]).filter(Boolean);
  idx=Math.min(u.idx, Math.max(0,queue.length-1));
  revealed=false;
  render();
}
function enterPlayer(p){
  player=p;
  undoStack=[];
  soloOnly=false;
  $('#soloToggle').checked=false;
  $('#playerName').textContent=p;
  $('#startScreen').classList.add('hidden');
  $('#studyScreen').classList.remove('hidden');
  buildQueue();
}
function leavePlayer(){
  player=null; queue=[]; idx=0; revealed=false; undoStack=[];
  $('#studyScreen').classList.add('hidden');
  $('#startScreen').classList.remove('hidden');
  $('#bottom').classList.add('hidden');
}

$$('.namebtn').forEach(b=>b.onclick=()=>enterPlayer(b.dataset.player));
$('#soloToggle').onchange=e=>{soloOnly=e.target.checked;buildQueue()};
$('#reveal').onclick=()=>{revealed=true;render(); const sc=$('#cardScroll'); if(sc) sc.scrollTop=0;};
$$('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
$('#switchPlayer').onclick=leavePlayer;
$('#undo').onclick=undoLast;

document.addEventListener('keydown',e=>{
  if(!player) return;
  if(e.code==='Space'&&!revealed){e.preventDefault();revealed=true;render()}
  if(revealed&&e.key==='1')rate('missed');
  if(revealed&&e.key==='2')rate('shaky');
  if(revealed&&e.key==='3')rate('know');
});
</script>
