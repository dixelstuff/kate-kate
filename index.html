<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#101114" />
<title>Emoji Escape — 4 Room Demo v2</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#23262d;--text:#f6f7f9;--muted:#9ca2ad;
  --cell:42px;--gap:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation}
#app{height:100svh;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7px) 8px calc(env(safe-area-inset-bottom) + 7px);gap:7px}
.topbar{width:min(100%,580px);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:40px}
.iconbtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--panel);color:#fff;font-size:21px;display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.95)}
.heading{text-align:center;line-height:1.05;min-width:0}.levelname{font-size:15px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.levelnum{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
#status{width:min(100%,580px);min-height:45px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1.15;color:#f0f1f4;text-align:center;transition:opacity .15s}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;gap:var(--gap);position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center;border-radius:9px;font-size:calc(var(--cell)*.66);line-height:1;background:rgba(255,255,255,.034);overflow:visible}
.cell.floor{box-shadow:inset 0 0 0 1px rgba(255,255,255,.022)}.cell.void{background:transparent;box-shadow:none;pointer-events:none}.cell.wall{background:rgba(255,255,255,.016);font-size:calc(var(--cell)*.61)}.cell.breakable{background:rgba(255,255,255,.025)}.cell.door{background:rgba(255,255,255,.055)}
.cell.lake{background:rgba(62,138,190,.08);font-size:calc(var(--cell)*.64)}.cell.lake .emoji{animation:waterBob 1.8s ease-in-out infinite}@keyframes waterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cell.machine{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.operatorGlyph{position:relative;z-index:2;font-size:calc(var(--cell)*.72);font-weight:900;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.cell.slot{box-shadow:inset 0 0 0 1.5px rgba(126,199,255,.34),0 0 9px rgba(126,199,255,.05)}
.cell.slot.outputSlot{box-shadow:inset 0 0 0 1.5px rgba(201,172,255,.30),0 0 9px rgba(201,172,255,.05)}
.cell.slot::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(158,214,255,.58);bottom:4px;right:4px}
.cell.button::after{content:"";position:absolute;left:20%;right:20%;bottom:8%;height:4px;border-radius:99px;background:rgba(255,255,255,.16);z-index:0}
.emoji{position:relative;z-index:2;display:block;transform-origin:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}.player{z-index:5;animation:playerIn .10s ease-out}@keyframes playerIn{from{transform:scale(.86)}to{transform:scale(1)}}
.placeable{box-shadow:inset 0 0 0 2px rgba(255,255,255,.46),0 0 0 2px rgba(255,255,255,.05)!important}.sourceGlow{animation:sourceGlow 1.45s ease-in-out infinite}@keyframes sourceGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.depleted{opacity:.22}.machineReact{animation:machineReact .27s ease-in-out}@keyframes machineReact{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.inventoryWrap{width:min(100%,580px);background:var(--panel);border-radius:16px;padding:8px 9px 9px;box-shadow:0 -1px 0 rgba(255,255,255,.04)}.invLabel{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 3px 6px}#inventory{min-height:48px;display:flex;gap:7px;overflow-x:auto;align-items:center;scrollbar-width:none}#inventory::-webkit-scrollbar{display:none}.invItem{border:0;border-radius:12px;background:var(--panel2);height:46px;min-width:46px;padding:0 8px;color:white;font-size:27px;display:flex;align-items:center;justify-content:center;gap:3px;position:relative}.invItem .count{font-size:11px;font-weight:800;color:#dfe1e6;align-self:flex-end;margin-bottom:7px}.invItem.selected{outline:2px solid rgba(255,255,255,.78);transform:translateY(-2px)}.emptyInv{color:#717680;font-size:13px;padding-left:5px}#hint{font-size:10px;color:#7d828c;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{position:absolute;z-index:12;display:grid;place-items:center;pointer-events:none;font-size:calc(var(--cell)*.78);line-height:1;left:0;top:0;width:100%;height:100%}.tntPulse{animation:tntPulse .18s ease-in-out 3}@keyframes tntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}.boomCenter{animation:boomCenter .28s ease-out forwards}@keyframes boomCenter{0%{transform:scale(.72);opacity:1}45%{transform:scale(1.38);opacity:1}100%{transform:scale(.55);opacity:.08}}.boomOuter{animation:boomOuter .44s ease-out forwards}@keyframes boomOuter{0%{transform:scale(.12);opacity:.12}42%{transform:scale(1.2);opacity:1}100%{transform:scale(.88);opacity:0}}.candleFly{animation:candleFly .28s ease-in forwards}@keyframes candleFly{to{transform:translate(var(--dx),var(--dy)) rotate(38deg) scale(.52);opacity:0}}.chickenHop{animation:chickenHop .20s ease-in-out}@keyframes chickenHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.peck{animation:peck .15s ease-in-out 3}@keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg) translateY(2px)}}.timeFlash{animation:timeFlash .38s ease-out}@keyframes timeFlash{0%{transform:scale(.62) rotate(-12deg);opacity:.18}60%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}.splash{animation:splash .42s ease-out forwards}@keyframes splash{0%{transform:scale(.4);opacity:.2}50%{transform:scale(1.28);opacity:1}100%{transform:scale(.85);opacity:0}}
.travel{animation:travel var(--dur) ease-in-out forwards}@keyframes travel{to{transform:translate(var(--tx),var(--ty)) scale(.94)}}.fadeInto{animation:fadeInto .18s ease-in forwards}@keyframes fadeInto{to{transform:translate(var(--tx),var(--ty)) scale(.52);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(4,5,6,.82);backdrop-filter:blur(8px);z-index:50;display:grid;place-items:center;padding:24px}.modalCard{width:min(100%,420px);background:#202329;border-radius:24px;padding:25px 20px;text-align:center}.modalBig{font-size:48px;margin-bottom:8px}.modalTitle{font-size:23px;font-weight:850;margin-bottom:7px}.modalText{font-size:14px;color:#bfc3ca;line-height:1.45;margin-bottom:18px}.primary{border:0;border-radius:14px;background:#f2f3f5;color:#111318;height:48px;padding:0 22px;font-size:16px;font-weight:800;width:100%}.helpText{text-align:left;font-size:14px;line-height:1.55;color:#d0d3d9}.helpText b{color:white}
@media (max-height:700px){#app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px)}#status{min-height:38px;font-size:13px;padding:6px 11px}.inventoryWrap{padding-top:6px;padding-bottom:6px}.invItem{height:42px;min-width:42px;font-size:25px}#hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><button class="iconbtn" id="helpBtn" aria-label="Help">?</button><div class="heading"><div class="levelname" id="levelName"></div><div class="levelnum" id="levelNum"></div></div><button class="iconbtn" id="resetBtn" aria-label="Reset room">↻</button></div>
  <div id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="inventoryWrap"><div class="invLabel"><span>Inventory</span><span id="faceLabel">🙂</span></div><div id="inventory"></div><div id="hint">Tap anywhere reachable to walk • swipe for single steps • select inventory then tap an adjacent cell to place</div></div>
</div>
<div id="overlayRoot"></div>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), key=(x,y)=>`${x},${y}`, dirs=[[1,0],[-1,0],[0,1],[0,-1]], clone=o=>JSON.parse(JSON.stringify(o));
const ITEMS={cloudSun:'🌥️',cloud:'☁️',water:'💧',sun:'☀️',rain:'🌧️',rainbow:'🌈',bear:'🐻',thread:'🧵',teddy:'🧸',tnt:'🧨',candle:'🕯️',puff:'💨',egg:'🥚',chick:'🐣',chicken:'🐔',keyNew:'🔑',keyOld:'🗝️',glasses:'👓'};
const emojiOf=id=>ITEMS[id]||id;

const LEVELS=[
{
  name:'Rainbow Workshop',wallEmoji:'🌿',requirement:'rainbow',
  map:[
    '  #######  ',
    ' ##.....###',
    '##..#.....#',
    '#.........#',
    '#....##...#',
    '##........D',
    ' #..#......#',
    ' #.........#',
    ' ###....####',
    '   ######   '
  ],
  player:[2,7],
  objects:{'2,2':'cloudSun','7,2':'cloud','8,3':'rain','5,7':'bear','8,7':'thread'},
  specials:{'3,5':'minus','7,6':'plus'},
  slots:{
    '2,5':{machine:'minus',role:'left'},'4,5':{machine:'minus',role:'right'},'3,4':{machine:'minus',role:'output'},
    '6,6':{machine:'plus',role:'left'},'8,6':{machine:'plus',role:'right'},'7,5':{machine:'plus',role:'output'}
  },
  messages:{intro:'Make what the door wants.'}
},
{
  name:'Iceworks',wallEmoji:'🪨',button:[7,3],
  map:[
    '   ###D###  ',
    '  ##......# ',
    ' ##........#',
    '#.........~~',
    '#......#.~~~',
    '##.....#.~~~',
    ' #.....#.~~~',
    ' #.......~~~',
    ' ##........# ',
    '  ##......## ',
    '   ########  '
  ],
  player:[4,8],
  objects:{'2,7':'tnt'},
  specials:{'3,8':'snow','2,3':'iceWater','8,8':'iceWater','7,3':'button'},
  lakes:['9,3','10,3','9,4','10,4','11,4','9,5','10,5','11,5','9,6','10,6','11,6','9,7','10,7','11,7'],
  extraWalls:['7,1','9,1','7,2','9,2','7,4','7,5','7,6'],
  messages:{intro:'Some ice never comes back.'}
},
{
  name:'Boiler Yard',wallEmoji:'🪵',button:[8,2],
  map:[
    '   ###D###   ',
    '  ##.....##  ',
    ' ##........# ',
    '#..........# ',
    '#..........##',
    '#...........#',
    '##..........#',
    ' #..........#',
    ' ##........##',
    '  ########## '
  ],
  player:[3,8],
  objects:{'3,7':'ball','9,7':'candle'},
  specials:{'2,6':'waterSource','2,5':'flame','2,4':'furnaceInput','8,2':'button'},
  slots:{'2,4':{machine:'furnace',role:'input'}},
  extraWalls:['9,4','8,1'],
  messages:{intro:'Water + heat makes something useful.'}
},
{
  name:'Old Future',wallEmoji:'🌲',
  map:[
    '   #######  ',
    ' ###.....D# ',
    '##.........#',
    '#....#.....#',
    '#..........#',
    '#..#.......#',
    '#......#####',
    '##.....#...#',
    ' #.....#...#',
    ' ###########'
  ],
  player:[2,8],
  objects:{'2,3':'egg'},
  specials:{'5,5':'hourglass','8,3':'worm'},
  slots:{'4,5':{machine:'time',role:'left'},'6,5':{machine:'time',role:'right'}},
  breakables:['7,8'],
  caveReward:[9,8,'glasses'],
  messages:{intro:'Time has a direction.'}
}
];

const state={levelIndex:0,level:null,inventory:{},selectedItem:null,face:'🙂',busy:false,auto:false,statusTimer:null,entryInventory:{},roomSerial:0,suppressClickUntil:0};
function addInv(id,n=1){state.inventory[id]=(state.inventory[id]||0)+n;if(state.inventory[id]<=0)delete state.inventory[id];renderInventory()}
function takeInv(id,n=1){if((state.inventory[id]||0)<n)return false;state.inventory[id]-=n;if(state.inventory[id]<=0){delete state.inventory[id];if(state.selectedItem===id)state.selectedItem=null}renderInventory();return true}
function hasInv(id){return(state.inventory[id]||0)>0}

function parseLevel(def){
  const height=def.map.length,width=Math.max(...def.map.map(r=>r.length));
  const walls=new Set(),floors=new Set(),voids=new Set(),doors=new Set(),lakes=new Set(def.lakes||[]),breakables=new Set(def.breakables||[]);
  for(let y=0;y<height;y++){
    const row=def.map[y].padEnd(width,' ');
    for(let x=0;x<width;x++){
      const c=row[x],k=key(x,y);
      if(c==='#')walls.add(k);else if(c==='D'){doors.add(k);floors.add(k)}else if(c==='.')floors.add(k);else if(c==='~'){lakes.add(k)}else voids.add(k);
    }
  }
  (def.extraWalls||[]).forEach(k=>{walls.add(k);floors.delete(k)});
  lakes.forEach(k=>{floors.delete(k);walls.delete(k)});
  breakables.forEach(k=>{walls.delete(k);floors.add(k)});
  return{def,width,height,walls,floors,voids,doors,lakes,breakables,player:{x:def.player[0],y:def.player[1]},objects:new Map(Object.entries(def.objects||{})),specials:new Map(Object.entries(def.specials||{})),slots:new Map(Object.entries(def.slots||{})),openDoor:false,sourceReady:new Map(),caveOpened:false};
}
function loadLevel(index,preserveInventory=true){
  state.levelIndex=index;state.level=parseLevel(LEVELS[index]);state.face='🙂';state.selectedItem=null;state.busy=false;state.auto=false;state.roomSerial++;
  if(!preserveInventory)state.inventory={};state.entryInventory=clone(state.inventory);
  $('#levelName').textContent=LEVELS[index].name;$('#levelNum').textContent=`ROOM ${index+1} / ${LEVELS.length}`;$('#faceLabel').textContent=state.face;
  sizeBoard();renderAll();say(LEVELS[index].messages?.intro||'',0);
}
function resetRoom(){state.inventory=clone(state.entryInventory);loadLevel(state.levelIndex,true);say('ROOM RESET',850)}
function sizeBoard(){const l=state.level;if(!l)return;const maxW=Math.min(window.innerWidth-16,580),reserved=205,maxH=Math.max(250,window.innerHeight-reserved);const cell=Math.floor(Math.min(48,(maxW-(l.width-1)*2)/l.width,(maxH-(l.height-1)*2)/l.height));document.documentElement.style.setProperty('--cell',`${Math.max(26,cell)}px`);$('#board').style.gridTemplateColumns=`repeat(${l.width},var(--cell))`;$('#board').style.gridTemplateRows=`repeat(${l.height},var(--cell))`}
function renderAll(){renderBoard();renderInventory();$('#faceLabel').textContent=state.face}
function wallEmojiAt(k){return state.level.breakables.has(k)?'🪨':state.level.def.wallEmoji}
function slotAt(k){return state.level.slots.get(k)||null}
function renderBoard(){
  const l=state.level,board=$('#board');board.innerHTML='';
  for(let y=0;y<l.height;y++)for(let x=0;x<l.width;x++){
    const k=key(x,y),cell=document.createElement('div');cell.className='cell';cell.dataset.x=x;cell.dataset.y=y;
    if(l.voids.has(k)){cell.classList.add('void');board.appendChild(cell);continue}
    if(l.lakes.has(k)){cell.classList.add('lake');cell.innerHTML='<span class="emoji">🌊</span>';board.appendChild(cell);continue}
    if(l.walls.has(k)||l.breakables.has(k)){cell.classList.add('wall');if(l.breakables.has(k))cell.classList.add('breakable');cell.innerHTML=`<span class="emoji">${wallEmojiAt(k)}</span>`;board.appendChild(cell);continue}
    cell.classList.add('floor');
    const special=l.specials.get(k),slot=slotAt(k);
    if(slot){cell.classList.add('slot');if(slot.role==='output')cell.classList.add('outputSlot')}
    if(special==='button')cell.classList.add('button');
    if(['plus','minus','hourglass','flame'].includes(special))cell.classList.add('machine');
    if(l.doors.has(k)&&!l.openDoor){cell.classList.add('door');cell.innerHTML='<span class="emoji">🚪</span>'}
    else{
      let underlying='';
      if(special==='plus')cell.innerHTML='<span class="operatorGlyph">+</span>';
      else if(special==='minus')cell.innerHTML='<span class="operatorGlyph">−</span>';
      else if(special==='snow')underlying='❄️';
      else if(special==='iceWater')underlying='💧';
      else if(special==='waterSource')underlying=(l.sourceReady.get(k)===false?'':'💧');
      else if(special==='flame')underlying='🔥';
      else if(special==='hourglass')underlying='⏳';
      else if(special==='worm')underlying='🪱';
      else if(special==='button')underlying='🔘';
      if(underlying)cell.innerHTML=`<span class="emoji ${['snow','waterSource'].includes(special)?'sourceGlow':''}">${underlying}</span>`;
      const obj=l.objects.get(k);
      if(obj){const em=obj==='ball'?'⚽':obj==='iceBlock'?'🧊':emojiOf(obj);cell.innerHTML=`<span class="emoji">${em}</span>`}
      if(l.player.x===x&&l.player.y===y)cell.innerHTML=`<span class="emoji player">${state.face}</span>`;
    }
    if(state.selectedItem&&isAdjacent(l.player.x,l.player.y,x,y)&&canPlaceSelectedAt(x,y))cell.classList.add('placeable');
    cell.addEventListener('click',()=>onCellTap(x,y));board.appendChild(cell);
  }
}
function renderInventory(){const inv=$('#inventory');inv.innerHTML='';const entries=Object.entries(state.inventory).filter(([,n])=>n>0);if(!entries.length){inv.innerHTML='<div class="emptyInv">empty</div>';return}entries.forEach(([id,n])=>{const b=document.createElement('button');b.className='invItem'+(state.selectedItem===id?' selected':'');b.innerHTML=`<span>${emojiOf(id)}</span>${n>1?`<span class="count">×${n}</span>`:''}`;b.addEventListener('click',()=>{if(state.busy)return;state.selectedItem=state.selectedItem===id?null:id;renderAll()});inv.appendChild(b)})}
function say(msg,ms=1300){const el=$('#status');clearTimeout(state.statusTimer);el.textContent=msg;el.style.opacity='1';if(ms)state.statusTimer=setTimeout(()=>{el.style.opacity='.72'},ms)}
function isAdjacent(x1,y1,x2,y2){return Math.abs(x1-x2)+Math.abs(y1-y2)===1}
function isFloor(x,y){const l=state.level,k=key(x,y);return l.floors.has(k)&&!l.walls.has(k)&&!l.breakables.has(k)&&!l.lakes.has(k)}
function isMachineCell(x,y){const s=state.level.specials.get(key(x,y));return['plus','minus','hourglass','flame'].includes(s)}
function occupied(x,y){const l=state.level,k=key(x,y);return l.objects.has(k)||(l.player.x===x&&l.player.y===y)}
function canPlaceSelectedAt(x,y){if(!state.selectedItem||!isFloor(x,y)||occupied(x,y)||state.level.doors.has(key(x,y))||isMachineCell(x,y))return false;const sl=slotAt(key(x,y));if(sl&&sl.role==='output')return false;const sp=state.level.specials.get(key(x,y));if(['snow','iceWater','waterSource','worm','button'].includes(sp))return false;return true}
function isCollectibleObject(id){return !['iceBlock','ball','chicken'].includes(id)}
function isPathPassable(x,y,goal=null){
  if(!isFloor(x,y)||isMachineCell(x,y))return false;const l=state.level,k=key(x,y);if(l.doors.has(k)&&!l.openDoor)return false;const obj=l.objects.get(k);if(obj&&!isCollectibleObject(obj))return false;const sp=l.specials.get(k);if(sp==='iceWater'&&state.face!=='🥶')return false;if(sp==='worm')return false;return true;
}
function onCellTap(x,y){
  if(Date.now()<state.suppressClickUntil||state.busy)return;const p=state.level.player;
  if(state.selectedItem&&canPlaceSelectedAt(x,y)){
    if(isAdjacent(p.x,p.y,x,y)){placeSelected(x,y);return}
    const near=bestReachableAdjacent(x,y);if(near){walkPath(findPath(p,near),()=>{if(state.selectedItem&&canPlaceSelectedAt(x,y)&&isAdjacent(state.level.player.x,state.level.player.y,x,y))placeSelected(x,y)});return}
  }
  if(isAdjacent(p.x,p.y,x,y)){moveOne(x-p.x,y-p.y);return}
  tapWalkTo(x,y);
}
function tapWalkTo(x,y){
  const l=state.level,k=key(x,y);
  if(l.lakes.has(k)||l.walls.has(k)||l.breakables.has(k)||l.voids.has(k))return;
  if(l.doors.has(k)&&!l.openDoor){const near=bestReachableAdjacent(x,y);if(!near)return;walkPath(findPath(l.player,near),()=>{moveOne(x-l.player.x,y-l.player.y)});return}
  if(isMachineCell(x,y)||l.specials.get(k)==='worm'||(l.objects.get(k)&&!isCollectibleObject(l.objects.get(k)))){const near=bestReachableAdjacent(x,y);if(near)walkPath(findPath(l.player,near));return}
  const path=findPath(l.player,{x,y});if(path.length)walkPath(path);
}
function bestReachableAdjacent(x,y){let best=null,bestPath=null;for(const[dx,dy]of dirs){const g={x:x+dx,y:y+dy};if(!isPathPassable(g.x,g.y))continue;const p=findPath(state.level.player,g);if((g.x===state.level.player.x&&g.y===state.level.player.y)||p.length){if(!bestPath||p.length<bestPath.length){best=g;bestPath=p}}}return best}
function findPath(start,goal){
  if(start.x===goal.x&&start.y===goal.y)return[];const q=[start],came=new Map([[key(start.x,start.y),null]]);while(q.length){const cur=q.shift();for(const[dx,dy]of dirs){const nx=cur.x+dx,ny=cur.y+dy,nk=key(nx,ny);if(came.has(nk))continue;if(!isPathPassable(nx,ny,goal))continue;came.set(nk,cur);if(nx===goal.x&&ny===goal.y){const path=[];let c={x:nx,y:ny};while(!(c.x===start.x&&c.y===start.y)){path.unshift(c);c=came.get(key(c.x,c.y))}return path}q.push({x:nx,y:ny})}}return[];
}
function walkPath(path,after){if(state.busy||state.auto||!path.length){if(after)after();return}state.auto=true;let i=0;const step=()=>{if(i>=path.length){state.auto=false;if(after)after();return}const t=path[i++],p=state.level.player;const moved=moveOne(t.x-p.x,t.y-p.y,true);if(!moved){state.auto=false;return}setTimeout(step,82)};step()}

function moveOne(dx,dy,fromAuto=false){
  if(state.busy||(!fromAuto&&state.auto))return false;const l=state.level,nx=l.player.x+dx,ny=l.player.y+dy,nk=key(nx,ny);if(!isFloor(nx,ny))return false;
  if(l.doors.has(nk)){
    if(l.openDoor){l.player={x:nx,y:ny};renderBoard();setTimeout(nextLevel,150);return true}
    if(state.levelIndex===0){if(hasInv('rainbow')){takeInv('rainbow');l.openDoor=true;say('🌈  DOOR OPEN',750);renderAll();return false}say('🚪  NEEDS  🌈',1800);return false}
    if(state.levelIndex===3){if(hasInv('keyOld')){takeInv('keyOld');l.openDoor=true;say('🗝️  DOOR OPEN',750);renderAll();return false}say('🚪  NEEDS  🗝️',1800);return false}
    say('🔘  IS HOLDING THE DOOR',1200);return false;
  }
  const obj=l.objects.get(nk);
  if(obj==='iceBlock'){if(fromAuto)return false;pushIce(nx,ny,dx,dy);return true}
  if(obj==='ball'){say('⚽  NEEDS A 💨',900);return false}
  if(obj==='chicken')return false;
  const special=l.specials.get(nk);
  if(isMachineCell(nx,ny))return false;if(special==='worm')return false;
  if(special==='iceWater'){
    if(state.face!=='🥶'){say('💧',500);return false}
    const bx=nx+dx,by=ny+dy;if(!isFloor(bx,by)||occupied(bx,by)||l.doors.has(key(bx,by))){say('NO ROOM FOR 🧊',900);return false}
    l.player={x:nx,y:ny};state.face='🙂';l.objects.set(key(bx,by),'iceBlock');say('🥶 + 💧 → 🧊',700);renderAll();return true;
  }
  l.player={x:nx,y:ny};
  if(special==='snow'){state.face='🥶';say('🥶',450)}
  if(special==='waterSource'){collectWaterSource(nk)}
  if(obj&&isCollectibleObject(obj)){l.objects.delete(nk);addInv(obj);say(`${emojiOf(obj)}  ADDED`,650)}
  renderAll();return true;
}
function collectWaterSource(k){const l=state.level;if(l.sourceReady.get(k)===false)return;l.sourceReady.set(k,false);addInv('water');say('💧  ADDED',600);renderAll();const serial=state.roomSerial;setTimeout(()=>{if(serial!==state.roomSerial)return;l.sourceReady.set(k,true);renderBoard()},1150)}

function pushIce(x,y,dx,dy){
  const l=state.level;let cx=x,cy=y;while(true){const nx=cx+dx,ny=cy+dy,nk=key(nx,ny);if(l.lakes.has(nk)){l.objects.delete(key(x,y));l.player={x,y};renderAll();spawnEffect(nx,ny,'💦','splash',430);say('🧊  LOST IN THE LAKE',850);updateButtonDoor();return}if(!isFloor(nx,ny)||l.objects.has(nk)||l.doors.has(nk)||isMachineCell(nx,ny)||['iceWater','snow'].includes(l.specials.get(nk)))break;cx=nx;cy=ny}
  if(cx===x&&cy===y){say('BLOCKED',500);return}l.objects.delete(key(x,y));l.objects.set(key(cx,cy),'iceBlock');l.player={x,y};updateButtonDoor();renderAll()
}
function updateButtonDoor(){const l=state.level;if(!l.def.button)return;const k=key(l.def.button[0],l.def.button[1]),obj=l.objects.get(k);l.openDoor=(state.levelIndex===1&&obj==='iceBlock')||(state.levelIndex===2&&obj==='ball');renderBoard()}

function placeSelected(x,y){
  const id=state.selectedItem;if(!id||!takeInv(id))return;state.selectedItem=null;const l=state.level,k=key(x,y);l.objects.set(k,id);renderAll();
  if(state.levelIndex===0){checkAlchemyAround(x,y);return}
  if(state.levelIndex===2){if(id==='water'&&slotAt(k)?.machine==='furnace'){runFurnace(k);return}if(id==='puff'){if(tryPuffBall(x,y))return}}
  if(state.levelIndex===3){if(slotAt(k)?.machine==='time'){runTimeMachine(x,y,id);return}if(id==='candle'||id==='tnt')checkTntIgnition()}
}
function checkAlchemyAround(x,y){const l=state.level,slot=slotAt(key(x,y));if(!slot||!['plus','minus'].includes(slot.machine))return;const m=slot.machine,op=findSpecial(m);if(!op)return;const leftK=slotKeyFor(m,'left'),rightK=slotKeyFor(m,'right'),outK=slotKeyFor(m,'output');if(!leftK||!rightK||!outK||l.objects.has(outK))return;const a=l.objects.get(leftK),b=l.objects.get(rightK);if(!a||!b)return;let result=null;if(m==='minus'&&a==='cloudSun'&&b==='cloud')result='sun';if(m==='plus'){const pair=[a,b].sort().join('+');result=({'cloud+water':'rain','rain+sun':'rainbow','bear+thread':'teddy'})[pair]||null}const cell=getCell(op.x,op.y);cell?.classList.add('machineReact');if(!result){say('NOTHING HAPPENS',700);return}state.busy=true;setTimeout(()=>{l.objects.delete(leftK);l.objects.delete(rightK);l.objects.set(outK,result);state.busy=false;renderAll();say(`${emojiOf(a)} ${m==='plus'?'+':'−'} ${emojiOf(b)} → ${emojiOf(result)}`,900)},260)}
function slotKeyFor(machine,role){for(const[k,v]of state.level.slots){if(v.machine===machine&&v.role===role)return k}return null}
function findSpecial(type){for(const[k,v]of state.level.specials){if(v===type){const[x,y]=k.split(',').map(Number);return{x,y}}}return null}

function runFurnace(inputK){const l=state.level;if(l.objects.get(inputK)!=='water')return;state.busy=true;const[x,y]=inputK.split(',').map(Number);say('💧 + 🔥',500);setTimeout(()=>{l.objects.set(inputK,'puff');state.busy=false;renderAll();spawnEffect(x,y,'💨','timeFlash',380);say('💨',500)},420)}
function tryPuffBall(px,py){const l=state.level;let ball=null;for(const[dx,dy]of dirs){const bx=px+dx,by=py+dy;if(l.objects.get(key(bx,by))==='ball'){ball={x:bx,y:by,dx,dy};break}}if(!ball)return false;let cx=ball.x,cy=ball.y,steps=0;while(steps<3){const nx=cx+ball.dx,ny=cy+ball.dy,nk=key(nx,ny);if(!isFloor(nx,ny)||l.objects.has(nk)||l.doors.has(nk)||isMachineCell(nx,ny)||['waterSource','button'].includes(l.specials.get(nk))&&false)break;cx=nx;cy=ny;steps++}
  if(!steps){say('BLOCKED',600);return false}
  state.busy=true;const puffK=key(px,py),ballK=key(ball.x,ball.y);const puffEl=getCell(px,py)?.querySelector('.emoji');if(puffEl){puffEl.classList.add('fadeInto');puffEl.style.setProperty('--tx',`${ball.dx*100}%`);puffEl.style.setProperty('--ty',`${ball.dy*100}%`)}
  setTimeout(()=>{l.objects.delete(puffK);l.objects.delete(ballK);renderBoard();animateTravel(ball.x,ball.y,cx,cy,'⚽',230);setTimeout(()=>{l.objects.set(key(cx,cy),'ball');state.busy=false;updateButtonDoor();renderAll();say(steps===3?'💨  3 CELLS':`💨  ${steps} CELL${steps===1?'':'S'}`,620)},235)},180);return true;
}
function animateTravel(x1,y1,x2,y2,emoji,duration){const cell=getCell(x1,y1);if(!cell)return;const e=document.createElement('span');e.className='fx travel';e.textContent=emoji;e.style.setProperty('--tx',`${(x2-x1)*(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'))+2)}px`);e.style.setProperty('--ty',`${(y2-y1)*(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'))+2)}px`);e.style.setProperty('--dur',`${duration}ms`);cell.appendChild(e);setTimeout(()=>e.remove(),duration+30)}

function runTimeMachine(x,y,id){const l=state.level,h=findSpecial('hourglass');if(!h||y!==h.y||Math.abs(x-h.x)!==1)return;const dir=x<h.x?'future':'past',outX=x<h.x?h.x+1:h.x-1,outK=key(outX,h.y),inK=key(x,y),result=timeResult(id,dir);if(!result){say('⏳  NOTHING HAPPENS',750);return}if(l.objects.has(outK)||(l.player.x===outX&&l.player.y===h.y)){say('OTHER SIDE BLOCKED',900);return}state.busy=true;setTimeout(()=>{l.objects.delete(inK);spawnEffect(h.x,h.y,'⏳','timeFlash',340);setTimeout(()=>{l.objects.set(outK,result);if(result!=='chicken')state.busy=false;renderAll();spawnEffect(outX,h.y,emojiOf(result),'timeFlash',380);say(`${emojiOf(id)} → ${emojiOf(result)}`,650);if(result==='chicken')setTimeout(()=>startChicken(outX,h.y),300)},210)},100)}
function timeResult(id,dir){const future={egg:'chick',chick:'chicken'},past={chicken:'chick',chick:'egg',keyNew:'keyOld'};return dir==='future'?future[id]:past[id]}
function startChicken(x,y){const l=state.level,w=findSpecial('worm');if(!w)return;const path=findAgentPath({x,y},w);if(!path.length){say('🐔  CANNOT REACH 🪱',900);return}state.busy=true;let i=0,cur={x,y};const step=()=>{if(i>=path.length){const wk=key(w.x,w.y);spawnEffect(w.x,w.y,'🐔','peck',500);setTimeout(()=>{l.objects.delete(wk);l.specials.delete(wk);l.objects.set(wk,'keyNew');state.busy=false;renderAll();say('🔑',800)},430);return}const next=path[i++];l.objects.delete(key(cur.x,cur.y));l.objects.set(key(next.x,next.y),'chicken');cur=next;renderAll();const em=getCell(next.x,next.y)?.querySelector('.emoji');em?.classList.add('chickenHop');setTimeout(step,190)};setTimeout(step,220)}
function findAgentPath(start,goal){const l=state.level,q=[start],came=new Map([[key(start.x,start.y),null]]);while(q.length){const cur=q.shift();if(cur.x===goal.x&&cur.y===goal.y)break;for(const[dx,dy]of dirs){const nx=cur.x+dx,ny=cur.y+dy,nk=key(nx,ny);if(came.has(nk)||!isFloor(nx,ny)||isMachineCell(nx,ny))continue;if(l.objects.has(nk)&&!(nx===goal.x&&ny===goal.y))continue;came.set(nk,cur);q.push({x:nx,y:ny})}}const gk=key(goal.x,goal.y);if(!came.has(gk))return[];const path=[];let c=goal;while(!(c.x===start.x&&c.y===start.y)){path.unshift(c);c=came.get(key(c.x,c.y))}return path}

function checkTntIgnition(){const l=state.level;let tnt=null,candle=null;for(const[k,id]of l.objects){const[ox,oy]=k.split(',').map(Number);if(id==='tnt')tnt={x:ox,y:oy};if(id==='candle')candle={x:ox,y:oy}}if(!tnt||!candle||!isAdjacent(tnt.x,tnt.y,candle.x,candle.y))return;state.busy=true;const ce=getCell(candle.x,candle.y)?.querySelector('.emoji');if(ce){ce.classList.add('candleFly');ce.style.setProperty('--dx',`${(tnt.x-candle.x)*100}%`);ce.style.setProperty('--dy',`${(tnt.y-candle.y)*100}%`)}setTimeout(()=>{l.objects.delete(key(candle.x,candle.y));renderBoard();const te=getCell(tnt.x,tnt.y)?.querySelector('.emoji');te?.classList.add('tntPulse');setTimeout(()=>explodeTnt(tnt.x,tnt.y),620)},280)}
function explodeTnt(x,y){const l=state.level;l.objects.delete(key(x,y));renderBoard();spawnEffect(x,y,'💥','boomCenter',300);setTimeout(()=>{dirs.forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,nk=key(nx,ny);spawnEffect(nx,ny,'💥','boomOuter',460);if(l.breakables.has(nk)){l.breakables.delete(nk);l.floors.add(nk);l.caveOpened=true}});setTimeout(()=>{if(l.caveOpened&&l.def.caveReward){const[rx,ry,id]=l.def.caveReward;if(!l.objects.has(key(rx,ry)))l.objects.set(key(rx,ry),id)}state.busy=false;renderAll();say('💥',500)},440)},145)}
function spawnEffect(x,y,emoji,cls,duration){const cell=getCell(x,y);if(!cell)return;const s=document.createElement('span');s.className=`fx ${cls||''}`;s.textContent=emoji;cell.appendChild(s);setTimeout(()=>s.remove(),duration||400)}
function getCell(x,y){return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`)}
function nextLevel(){if(state.levelIndex<LEVELS.length-1)loadLevel(state.levelIndex+1,true);else finishGame()}
function finishGame(){state.busy=true;const inv=Object.entries(state.inventory).map(([id,n])=>`${emojiOf(id)}${n>1?'×'+n:''}`).join(' ');$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">🚪✨</div><div class="modalTitle">FOUR ROOMS ESCAPED</div><div class="modalText">${inv?`You finished with ${inv}`:'You made it out.'}</div><button class="primary" id="again">PLAY AGAIN</button></div></div>`;setTimeout(()=>{$('#again').onclick=()=>{state.inventory={};$('#overlayRoot').innerHTML='';state.busy=false;loadLevel(0,false)}},650)}
function showHelp(){$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">🙂</div><div class="modalTitle">HOW TO PLAY</div><div class="helpText"><b>Tap anywhere reachable</b> and 🙂 will walk there.<br><br>Walk over loose emoji to add them to inventory.<br><br><b>Place an item:</b> tap it in inventory, then tap an adjacent empty cell.<br><br>Blue-edged cells are machine input/output areas. Swipe still moves one cell at a time. ↻ resets the room.</div><button class="primary" id="helpClose">PLAY</button></div></div>`;$('#helpClose').onclick=()=>$('#overlayRoot').innerHTML=''}

let touchStart=null;
$('#board').addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$('#board').addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length||state.busy)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;state.suppressClickUntil=Date.now()+350;state.auto=false;if(Math.abs(dx)>Math.abs(dy))moveOne(dx>0?1:-1,0);else moveOne(0,dy>0?1:-1)},{passive:true});
$('#resetBtn').addEventListener('click',resetRoom);$('#helpBtn').addEventListener('click',showHelp);window.addEventListener('resize',()=>{sizeBoard();renderBoard()});window.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(m[e.key]){e.preventDefault();state.auto=false;moveOne(...m[e.key])}});
loadLevel(0,false);
})();
</script>
</body>
