<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#101114" />
<title>Emoji Escape — Homecoming</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#23262d;--text:#f6f7f9;--muted:#9ca2ad;
  --cell:42px;--gap:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100svh;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7px) 8px calc(env(safe-area-inset-bottom) + 7px);gap:7px}
.topbar{width:min(100%,580px);display:grid;grid-template-columns:40px 32px 1fr 32px 40px;gap:3px;align-items:center;min-height:40px}
.iconbtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--panel);color:#fff;font-size:21px;display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.95)}.levelnav{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.035);font-size:22px}
.heading{text-align:center;line-height:1.05;min-width:0}.levelname{font-size:15px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.levelnum{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
#status{width:min(100%,580px);min-height:45px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1.15;color:#f0f1f4;text-align:center;transition:opacity .15s}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;gap:var(--gap);position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center;border-radius:9px;font-size:calc(var(--cell)*.66);line-height:1;background:rgba(255,255,255,.034);overflow:visible}
.cell.floor{box-shadow:inset 0 0 0 1px rgba(255,255,255,.022)}.cell.void{background:transparent;box-shadow:none;pointer-events:none}.cell.wall{background:rgba(255,255,255,.016);font-size:calc(var(--cell)*.61)}.cell.breakable{background:rgba(255,255,255,.025)}.cell.door{background:rgba(255,255,255,.055)}
.cell.lake{background:rgba(62,138,190,.08);font-size:calc(var(--cell)*.64)}.cell.lake .emoji{animation:waterBob 1.8s ease-in-out infinite}@keyframes waterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cell.machine{background:rgba(255,255,255,.034);box-shadow:inset 0 0 0 1px rgba(255,255,255,.022)}
.operatorGlyph{position:relative;z-index:2;font-size:calc(var(--cell)*.72);font-weight:900;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.cell.slotActive{box-shadow:inset 0 0 0 1px rgba(214,230,240,.07);background:rgba(214,230,240,.008)}.cell.tntInput{box-shadow:inset 0 0 0 2px rgba(255,226,120,.22),0 0 10px rgba(255,220,100,.08);background:rgba(255,220,100,.025)}
.emoji{position:relative;z-index:2;display:block;transform-origin:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}.player{z-index:5;animation:playerIn .10s ease-out}@keyframes playerIn{from{transform:scale(.86)}to{transform:scale(1)}}
.placeable{}.sourceGlow{animation:sourceGlow 1.45s ease-in-out infinite}@keyframes sourceGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.depleted{opacity:.22}.machineReact{animation:machineReact .27s ease-in-out}@keyframes machineReact{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.bottomBar{width:min(100%,580px);display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:end}.dpad{width:108px;height:108px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:3px;align-self:end}.dpad button{border:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:10px;background:var(--panel2);color:#fff;font-size:20px;font-weight:800;padding:0;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}.dpad button:active{transform:scale(.92);background:#30343d}.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.dpadCore{grid-column:2;grid-row:2;border-radius:11px;background:rgba(255,255,255,.035)}.inventoryWrap{width:100%;min-width:0;background:var(--panel);border-radius:16px;padding:8px 9px 9px;box-shadow:0 -1px 0 rgba(255,255,255,.04)}.invLabel{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 3px 6px}#inventory{min-height:48px;display:flex;gap:7px;overflow-x:auto;align-items:center;scrollbar-width:none}#inventory::-webkit-scrollbar{display:none}.invItem{border:0;border-radius:12px;background:var(--panel2);height:46px;min-width:46px;padding:0 8px;color:white;font-size:27px;display:flex;align-items:center;justify-content:center;gap:3px;position:relative}.invItem .count{font-size:11px;font-weight:800;color:#dfe1e6;align-self:flex-end;margin-bottom:7px}.invItem.selected{outline:2px solid rgba(255,255,255,.78);transform:translateY(-2px)}.emptyInv{color:#717680;font-size:13px;padding-left:5px}#hint{font-size:10px;color:#7d828c;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{position:absolute;z-index:12;display:grid;place-items:center;pointer-events:none;font-size:calc(var(--cell)*.78);line-height:1;left:0;top:0;width:100%;height:100%}.tntPulse{animation:tntPulse .18s ease-in-out 3}@keyframes tntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}.boomCenter{animation:boomCenter .28s ease-out forwards}@keyframes boomCenter{0%{transform:scale(.72);opacity:1}45%{transform:scale(1.38);opacity:1}100%{transform:scale(.55);opacity:.08}}.boomOuter{animation:boomOuter .44s ease-out forwards}@keyframes boomOuter{0%{transform:scale(.12);opacity:.12}42%{transform:scale(1.2);opacity:1}100%{transform:scale(.88);opacity:0}}.candleFly{animation:candleFly .28s ease-in forwards}@keyframes candleFly{to{transform:translate(var(--dx),var(--dy)) rotate(38deg) scale(.52);opacity:0}}.chickenHop{animation:chickenHop .20s ease-in-out}@keyframes chickenHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.peck{animation:peck .15s ease-in-out 3}@keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg) translateY(2px)}}.timeFlash{animation:timeFlash .38s ease-out}@keyframes timeFlash{0%{transform:scale(.62) rotate(-12deg);opacity:.18}60%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}.splash{animation:splash .42s ease-out forwards}@keyframes splash{0%{transform:scale(.4);opacity:.2}50%{transform:scale(1.28);opacity:1}100%{transform:scale(.85);opacity:0}}
.travel{animation:travel var(--dur) linear forwards}@keyframes travel{0%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--tx),var(--ty)) scale(.96)}}
.doorDissolve .emoji{animation:doorDissolve .62s ease-out forwards}.doorDissolve{animation:doorCellFlash .62s ease-out forwards}@keyframes doorDissolve{0%{transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 1px 1px rgba(0,0,0,.25))}28%{transform:scale(1.22) rotate(-3deg);opacity:1;filter:blur(0) brightness(1.35)}100%{transform:scale(.52) rotate(9deg);opacity:0;filter:blur(8px) brightness(1.8)}}@keyframes doorCellFlash{0%,100%{background:rgba(255,255,255,.055)}35%{background:rgba(255,255,255,.22)}}.fadeInto{animation:fadeInto .18s ease-in forwards}@keyframes fadeInto{to{transform:translate(var(--tx),var(--ty)) scale(.52);opacity:0}}

.cell.button{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.34),0 0 14px rgba(255,255,255,.18);animation:targetPulse 1.8s ease-in-out infinite}.cell.button .emoji{filter:drop-shadow(0 0 5px rgba(255,255,255,.65))}@keyframes targetPulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 0 9px rgba(255,255,255,.10)}50%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(255,255,255,.26)}}
.cell.coloredBook{cursor:pointer}.bookShake .emoji{animation:bookShake .24s ease-in-out}@keyframes bookShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px) rotate(-5deg)}70%{transform:translateX(5px) rotate(5deg)}}
#beamLine{position:absolute;z-index:4;height:7px;border-radius:8px;transform-origin:0 50%;pointer-events:none;background:linear-gradient(90deg,rgba(255,248,185,.98),rgba(255,226,85,.84),rgba(255,220,70,.08));box-shadow:0 0 7px rgba(255,235,120,.95),0 0 18px rgba(255,220,80,.7)}
.cell.tableCell{background:rgba(115,78,42,.13)}
.cell.discoOn .emoji{animation:discoSpin .8s linear infinite;filter:drop-shadow(0 0 7px rgba(255,255,255,.8))}
@keyframes discoSpin{0%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.08)}100%{transform:rotate(-7deg) scale(1)}}
.shelfSlide .emoji{animation:shelfSlide .34s ease-in forwards}@keyframes shelfSlide{to{transform:translateX(78%) rotate(8deg);opacity:0}}
.balloonPop{animation:balloonPop .22s ease-out forwards}@keyframes balloonPop{0%{transform:scale(1)}55%{transform:scale(1.35)}100%{transform:scale(.1);opacity:0}}
.presentSpawn{animation:presentSpawn .36s cubic-bezier(.2,.9,.25,1.25)}@keyframes presentSpawn{from{transform:scale(.15) rotate(-12deg);opacity:.2}to{transform:scale(1);opacity:1}}
.flyBack{position:fixed;z-index:80;pointer-events:none;font-size:30px;line-height:1;transition:transform .38s cubic-bezier(.25,.75,.3,1),opacity .38s ease}

/* Integrated room-specific surfaces */
.cell.horseGrass{background:rgba(91,127,68,.13);box-shadow:inset 0 0 0 1px rgba(166,203,125,.075)}
.cell.horseTarget{background:rgba(120,151,79,.18);box-shadow:inset 0 0 0 1px rgba(201,225,151,.12)}
.cell.libraryWall{background:#342921;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(225,197,154,.10),inset 0 -2px 0 rgba(0,0,0,.12)}

.cell.horseWall{background:rgba(119,78,43,.08)}
.horseJiggle{animation:horseJiggle .28s ease-in-out}
@keyframes horseJiggle{0%,100%{transform:translateX(0)}28%{transform:translateX(-5px) rotate(-4deg)}62%{transform:translateX(5px) rotate(4deg)}}
.horseHop{animation:horseHop .19s ease-in-out}
@keyframes horseHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(1.04)}}

.cell.marketFloor{background:rgba(255,255,255,.052);box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
.cell.marketShelf{background:rgba(117,78,43,.17);box-shadow:inset 0 0 0 1px rgba(183,133,80,.20)}
.cell.marketShelf.sectionBreak{box-shadow:inset 0 2px 0 rgba(236,210,173,.34),inset 0 0 0 1px rgba(183,133,80,.20)}
.cell.marketCheckout{background:rgba(255,255,255,.065);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.marketCartSlot{border:0;border-radius:12px;background:var(--panel2);height:46px;min-width:46px;padding:0;color:white;font-size:27px;display:flex;align-items:center;justify-content:center}
.marketCartSlot.empty{font-size:14px;color:#545963}
.marketHistory{margin-top:12px;max-height:230px;overflow:auto;text-align:left;border-top:1px solid rgba(255,255,255,.08);padding-top:6px;scrollbar-width:thin}
.marketHistoryRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.marketHistoryItems{font-size:22px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marketHistoryTotal{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}

.cell.mirrorPanel{background:rgba(173,207,226,.14);box-shadow:inset 0 0 0 1px rgba(207,232,245,.22),0 0 7px rgba(179,220,241,.08);font-size:calc(var(--cell)*.58)}
.cell.mirrorButtonOn{background:rgba(255,255,255,.22)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.64),0 0 18px rgba(255,255,255,.28)!important}
.mirrorGhost{position:absolute;inset:0;display:grid;place-items:center;z-index:7;opacity:.53;filter:saturate(.7) brightness(1.18) drop-shadow(0 0 4px rgba(177,224,255,.35));transition:none!important}
.mirrorGhost.deep{opacity:.34}.mirrorPlayer{position:absolute;inset:0;display:grid;place-items:center;z-index:10}
.mirrorRefuse .emoji{animation:mirrorRefuse .26s ease-in-out}
@keyframes mirrorRefuse{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.cell.exitThreshold{background:rgba(225,243,255,.12)!important;box-shadow:inset 0 0 0 2px rgba(215,240,255,.48),0 0 18px rgba(173,224,255,.28)!important;animation:exitGlow 1.25s ease-in-out infinite}
.exitArrow{font-size:calc(var(--cell)*.48);font-weight:900;color:#eefaff;text-shadow:0 0 8px rgba(194,232,255,.9)}
@keyframes exitGlow{0%,100%{box-shadow:inset 0 0 0 2px rgba(215,240,255,.35),0 0 10px rgba(173,224,255,.16)}50%{box-shadow:inset 0 0 0 2px rgba(235,249,255,.75),0 0 23px rgba(173,224,255,.38)}}
.cell.goalLeft > .emoji{transform:rotate(-90deg) !important}
.cell.goalRight > .emoji{transform:rotate(90deg) !important}
.cell.goalCell{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.goalie{position:absolute;inset:0;display:grid;place-items:center;z-index:8;font-size:calc(var(--cell)*.62);filter:drop-shadow(0 0 5px rgba(255,255,255,.5))}
.cell.tntPadCue{box-shadow:inset 0 0 0 2px rgba(255,225,111,.36),0 0 13px rgba(255,221,93,.10);background:rgba(255,221,93,.025)}
.blurredClue{font-size:18px;color:#f7f7f7;filter:blur(4px);opacity:.72;line-height:1.55;margin:8px 0 16px;user-select:none}
.cell.partyRoofDisco{background:rgba(64,52,76,.18)!important;box-shadow:inset 0 0 0 1px rgba(231,225,255,.18),0 0 10px rgba(217,200,255,.08)}
#board.partyDisco:after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:10px;background:radial-gradient(circle at 20% 22%,rgba(255,110,170,.26) 0 4%,transparent 9%),radial-gradient(circle at 78% 24%,rgba(88,214,255,.25) 0 4%,transparent 9%),radial-gradient(circle at 68% 70%,rgba(255,227,92,.22) 0 4%,transparent 10%),radial-gradient(circle at 28% 76%,rgba(149,107,255,.24) 0 4%,transparent 9%);animation:partyWash 1.35s linear infinite alternate;mix-blend-mode:screen}
@keyframes partyWash{0%{opacity:.48;transform:scale(1)}100%{opacity:.88;transform:scale(1.018)}}


.modalClose{position:absolute;right:14px;top:12px;border:0;background:transparent;color:#ddd;font-size:28px;line-height:1;padding:4px}.modalCard{position:relative}.pinSlots{display:flex;justify-content:center;gap:10px;margin:12px 0 10px}.pinSlot{width:48px;height:52px;border-radius:10px;background:#111318;display:grid;place-items:center;font-size:24px;font-weight:850}.pinInput{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:0;border-radius:14px;background:#111318;color:#fff;font-size:24px;font-weight:850;letter-spacing:.28em;text-align:center;text-transform:uppercase;outline:none;margin:6px 0 12px;padding-left:.28em}
.pinHint{min-height:22px;color:#aeb3bc;font-size:12px;margin-bottom:8px}

.modal{position:fixed;inset:0;background:rgba(4,5,6,.82);backdrop-filter:blur(8px);z-index:50;display:grid;place-items:center;padding:24px}.modalCard{width:min(100%,420px);background:#202329;border-radius:24px;padding:25px 20px;text-align:center}.modalBig{font-size:48px;margin-bottom:8px}.modalTitle{font-size:23px;font-weight:850;margin-bottom:7px}.modalText{font-size:14px;color:#bfc3ca;line-height:1.45;margin-bottom:18px}.primary{border:0;border-radius:14px;background:#f2f3f5;color:#111318;height:48px;padding:0 22px;font-size:16px;font-weight:800;width:100%;margin-top:12px}.helpText{text-align:left;font-size:14px;line-height:1.55;color:#d0d3d9}.helpText b{color:white}
@media (max-height:700px){#app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px)}#status{min-height:38px;font-size:13px;padding:6px 11px}.bottomBar{grid-template-columns:96px minmax(0,1fr)}.dpad{width:96px;height:96px;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px)}.inventoryWrap{padding-top:6px;padding-bottom:6px}.invItem{height:42px;min-width:42px;font-size:25px}#hint{display:none}}

.marketOutcome{font-size:14px;font-weight:900;letter-spacing:.08em;margin:6px 0 2px}
.marketOutcome.pass{color:#79e28f}
.marketOutcome.fail{color:#ff8585}
.modalCard.marketPass{box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(85,214,112,.24)}
.modalCard.marketFail{box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,95,95,.20)}
.blurredBook{filter:blur(3.2px);opacity:.78}


/* ---------- COOL CHANGE ---------- */
.cell.coolBrick{
  border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 -3px 0 rgba(0,0,0,.16);
  transition:background .38s ease,box-shadow .38s ease,filter .38s ease,transform .38s ease;
}
#board.coolPulse .coolBrick{animation:coolBrickPulse .34s ease-out}
@keyframes coolBrickPulse{0%{transform:scale(.96)}55%{transform:scale(1.035);filter:brightness(1.22)}100%{transform:scale(1)}}
.cell.coolDay{background:rgba(255,255,255,.055);border-radius:0;color:#c9ced6;font-size:calc(var(--cell)*.21);font-weight:900;letter-spacing:.07em}
.cell.coolTemp{background:rgba(255,255,255,.065);border-radius:0;color:#fff;font-size:calc(var(--cell)*.34);font-weight:900}
.cell.coolTemp.selected{box-shadow:inset 0 0 0 1px rgba(255,255,255,.48),0 0 12px rgba(255,255,255,.12);filter:brightness(1.14)}
.cell.coolTemp.jiggle{animation:coolTempJiggle .22s ease-in-out}
@keyframes coolTempJiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.cell.coolTemp.solvePulse{animation:coolSolvePulse .58s ease-out}
@keyframes coolSolvePulse{0%{transform:scale(1)}35%{transform:scale(1.14);filter:brightness(2)}70%{transform:scale(.96);filter:brightness(1.35)}100%{transform:scale(1)}}
.cell.coolPlusMachine{background:rgba(43,190,190,.25)!important;box-shadow:inset 0 0 0 2px rgba(102,238,230,.52),0 0 13px rgba(61,218,211,.16)!important}
.cell.coolMinusMachine{background:rgba(225,112,79,.25)!important;box-shadow:inset 0 0 0 2px rgba(255,157,120,.52),0 0 13px rgba(239,112,79,.16)!important}

/* ---------- FINAL POND ---------- */
.cell.pondGrass{background:rgba(73,111,63,.12);box-shadow:inset 0 0 0 1px rgba(160,204,142,.05)}
.cell.pondWater{background:rgba(55,139,190,.14);box-shadow:inset 0 0 0 1px rgba(117,195,231,.10)}
.cell.lily{background:rgba(55,139,190,.14);font-size:calc(var(--cell)*.60)}
.cell.finalPedestal{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.cell.finalRelease{background:rgba(115,153,91,.16);box-shadow:inset 0 0 0 1px rgba(186,219,157,.14)}
.cell.finalMirror{background:rgba(175,211,230,.12);box-shadow:inset 0 0 0 1px rgba(207,232,245,.22)}
.frogHop{animation:frogHop .28s ease-out}
@keyframes frogHop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-10px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
.butterflyFloat{animation:butterflyFloat .5s ease-in-out}
@keyframes butterflyFloat{0%{transform:translate(-5px,3px) rotate(-8deg);opacity:.25}50%{transform:translate(4px,-7px) rotate(8deg);opacity:1}100%{transform:translate(0,0);opacity:.95}}
.finalHeart{animation:finalHeart .75s ease-out}
@keyframes finalHeart{0%{transform:scale(.2);opacity:.1}45%{transform:scale(1.45);opacity:1}100%{transform:scale(1);opacity:1}}


.cell.mirrorDoorClosed{
  background:rgba(255,255,255,.055)!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)!important;
}
.cell.mirrorExitOpen{
  background:rgba(114,221,205,.18)!important;
  box-shadow:inset 0 0 0 2px rgba(170,255,240,.42),0 0 18px rgba(115,235,214,.24)!important;
  animation:mirrorExitPulse 1s ease-in-out infinite alternate;
}
@keyframes mirrorExitPulse{from{filter:brightness(.95)}to{filter:brightness(1.35)}}

</style>
</head>
<body>
<div id="app">
  <div class="topbar"><button class="iconbtn" id="helpBtn" aria-label="Help">?</button><button class="iconbtn levelnav" id="prevLevel" aria-label="Previous room">‹</button><div class="heading"><div class="levelname" id="levelName"></div><div class="levelnum" id="levelNum"></div></div><button class="iconbtn levelnav" id="nextLevel" aria-label="Next room">›</button><button class="iconbtn" id="resetBtn" aria-label="Reset room">↻</button></div>
  <div id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="bottomBar">
    <div class="dpad" aria-label="Movement controls">
      <button class="up" data-move="0,-1" aria-label="Move up">↑</button>
      <button class="left" data-move="-1,0" aria-label="Move left">←</button>
      <div class="dpadCore"></div>
      <button class="right" data-move="1,0" aria-label="Move right">→</button>

function parseLevel(def){
  const height=def.map.length,width=Math.max(...def.map.map(r=>r.length));
  const walls=new Set(),floors=new Set(),voids=new Set(),doors=new Set(),lakes=new Set(def.lakes||[]),breakables=new Set(def.breakables||[]);
  for(let y=0;y<height;y++){
    const row=def.map[y].padEnd(width,' ');
    for(let x=0;x<width;x++){
      const c=row[x],k=key(x,y);
      if(c==='#')walls.add(k);else if(c==='D'){doors.add(k);floors.add(k)}else if(c==='.')floors.add(k);else if(c==='~'){lakes.add(k)}else voids.add(k);
    }
  }
  (def.extraWalls||[]).forEach(k=>{walls.add(k);floors.delete(k)});
  lakes.forEach(k=>{floors.delete(k);walls.delete(k)});
  breakables.forEach(k=>{walls.delete(k);floors.add(k)});
  return{def,width,height,walls,floors,voids,doors,lakes,breakables,player:{x:def.player[0],y:def.player[1]},objects:new Map(Object.entries(def.objects||{})),specials:new Map(Object.entries(def.specials||{})),slots:new Map(Object.entries(def.slots||{})),openDoor:false,sourceReady:new Map(),caveOpened:false,hearthLit:false,shelfOpened:false,libraryClueKnown:false,libraryReadCount:0,libraryGlassesOn:false,pinSolved:false,pinAttempts:0,flashDir:def.flashDir?def.flashDir.slice():[1,0],partyReady:false,partyPopped:false,bookSeq:[],torchOn:false,postPopSnapshot:null,tntInput:null,iceTntRevealed:false,fireGoalActive:false,fireGoalScored:false,keeperIndex:0,keeperDir:1,horse:def.horse?{x:def.horse[0],y:def.horse[1]}:null,horseBuffer:[],horseBusy:false,horseEngaged:false,horseSolved:false,mirrorPanels:def.mirrorPanels?clone(def.mirrorPanels):null,mirrorUnlocking:false,coolPlus:false,coolMinus:false,coolSequence:[],coolMarks:new Set(),coolPulse:false,finalTimeActive:false,finalFrog:def.frog?{x:def.frog[0],y:def.frog[1]}:null,finalButterfly:null,finalFrogLured:false,finalDemoDone:false,finalLipstickUsed:false,market:def.type==='market'?{roundIndex:0,history:[],cart:[],required:[],sections:[],stock:{},sectionBreaks:{},taken:{},timeLeft:MARKET_ROUNDS[0].seconds,running:false,checkingOut:false,hasLeftCheckout:false,complete:false,introShown:false,rewardReady:false}:null};
}
function loadLevel(index,preserveInventory=true,opts={}){
  if(index<0||index>=LEVELS.length)return;
  stopMarketTimer();stopFireKeeper();
  if(state.level&&!state.suspendSave){state.savedLevels[state.levelIndex]=serializeLevel(state.level);writeProgress()}
  state.suspendSave=true;state.levelIndex=index;state.selectedItem=null;state.busy=false;state.auto=false;state.roomSerial++;
  if(!preserveInventory){state.inventory={};state.invOrder=[]}
  const snap=state.savedLevels[index]||null;state.level=restoreLevel(LEVELS[index],snap);
  if(state.completed.has(index)&&!opts.resumeCurrent)state.level.player={x:LEVELS[index].player[0],y:LEVELS[index].player[1]};
  state.face=LEVELS[index].id==='horse'?(state.level.horseEngaged&&!state.level.horseSolved?'🤠':'🙂'):(opts.resumeFace||'🙂');
  state.entryInventory=clone(state.inventory);state.entryInvOrder=[...state.invOrder];

  if(LEVELS[index].id==='market'&&state.level.market&&!state.level.market.required.length)marketPrepareAttempt(false);
  if(LEVELS[index].id==='finale')ensureFinaleKit();
  const marketIntroNow=LEVELS[index].id==='market'&&!state.completed.has(index)&&state.level.market&&!state.level.market.introShown;

  $('#levelName').textContent=LEVELS[index].name;$('#levelNum').textContent=`ROOM ${index+1} / ${LEVELS.length}`;updateNavButtons();
  sizeBoard();renderBoard();renderInventory();state.suspendSave=false;queueSave();

  if(marketIntroNow){
    state.busy=true;
    setTimeout(()=>{if(isLevel('market')&&!document.querySelector('#overlayRoot .modal')){state.busy=false;showMarketIntro()}},720);
  }

  if(LEVELS[index].id==='market'){
    if(state.completed.has(index))say('ROOM COMPLETE',700);else marketUpdateStatus();
  }else if(!opts.silent){
    say(state.completed.has(index)?'ROOM COMPLETE':(LEVELS[index].messages?.intro||''),state.completed.has(index)?700:1800);
  }
  if(LEVELS[index].id==='fire'&&state.level.hearthLit)startSmokeEmitter();
  if(LEVELS[index].id==='fire'&&state.level.fireGoalActive&&!state.level.fireGoalScored)startFireKeeper();
  if(LEVELS[index].id==='finale'&&!state.level.finalDemoDone)finaleDemo();
}
function resetRoom(){
  stopMarketTimer();stopFireKeeper();stopDpad();
  state.roomSerial++;
  clearTimeout(state.statusTimer);

  // Market reset = retry current round while preserving useful basket history.
  if(isLevel('market')){
    state.busy=false;state.selectedItem=null;
    marketPrepareAttempt(true);renderAll();marketUpdateStatus();say('RESET',420);return
  }

  // Party after the balloon has popped resets only the Sokoban/present phase.
  if(isLevel('party')&&!state.completed.has(state.levelIndex)&&state.level.partyPopped&&state.level.postPopSnapshot){
    const l=state.level,s=l.postPopSnapshot;
    l.objects=new Map(s.objects);l.walls=new Set(s.walls);l.floors=new Set(s.floors);l.specials=new Map(s.specials);
    l.player={...s.player};l.openDoor=false;l.partyReady=true;l.partyPopped=true;l.torchOn=false;
    state.inventory=clone(s.inventory);state.invOrder=[...(s.invOrder||Object.keys(s.inventory))];
    state.face='🙂';state.selectedItem=null;state.busy=false;
    state.savedLevels[state.levelIndex]=serializeLevel(l);renderAll();say('PRESENTS RESET',650);return
  }

  // Every other room gets a true fresh room state rather than restoring
  // the most recently autosaved snapshot.
  state.inventory=clone(state.entryInventory);
  state.invOrder=[...(state.entryInvOrder||Object.keys(state.inventory))];
  state.selectedItem=null;state.face='🙂';state.busy=false;state.auto=false;
  state.suspendSave=true;
  state.level=parseLevel(LEVELS[state.levelIndex]);
  state.savedLevels[state.levelIndex]=serializeLevel(state.level);
  state.suspendSave=false;
  sizeBoard();renderAll();updateNavButtons();say('RESET',450)
}

function coolProgress(){return isLevel('cool')?Math.min(1,(state.level.coolMarks?.size||0)/COOL_TOTAL_STEPS):0}
function coolAdvance(mark){
  const l=state.level;if(!isLevel('cool')||l.coolMarks.has(mark))return;
  l.coolMarks.add(mark);l.coolPulse=true;clearTimeout(l._coolPulseTimer);
  l._coolPulseTimer=setTimeout(()=>{if(isLevel('cool')){l.coolPulse=false;renderBoard()}},360);
}
function coolBrickStyle(cell,x,y){
  const p=coolProgress(),spread=(x*31+y*47)%360,off=(((x*11+y*7)%19)-9);let hue,sat,light;
  if(p>=1){hue=spread;sat=64;light=39}
  else{hue=216-(30*p)+off*(.18+.38*p);sat=38+27*p;light=17+15*p}
  cell.style.background=`hsl(${hue}deg ${sat}% ${light}%)`;
  if(p>.72)cell.style.boxShadow=`inset 0 0 0 1px rgba(255,255,255,${.05+.10*p}), inset 0 -3px 0 rgba(0,0,0,.16), 0 0 ${Math.round(7*p)}px hsla(${hue}deg,70%,50%,${.08*p})`;
}
function coolTempValue(sp){return sp==='coolTemp29'?29:sp==='coolTemp14'?14:sp==='coolTemp15'?15:null}
function coolSeqPrefix(seq,list){return list.some(t=>seq.every((v,i)=>t[i]===v))}
function coolBumpTemp(x,y,sp){
  const l=state.level,v=coolTempValue(sp),cell=getCell(x,y);if(v==null)return;
  cell?.classList.remove('jiggle');void cell?.offsetWidth;cell?.classList.add('jiggle');setTimeout(()=>cell?.classList.remove('jiggle'),240);
  if(l.coolSequence.includes(v)){l.coolSequence=[v];renderBoard();return}
  l.coolSequence.push(v);
  let dir=coolSeqPrefix(l.coolSequence,COOL_PLUS_SEQS)?'plus':coolSeqPrefix(l.coolSequence,COOL_MINUS_SEQS)?'minus':null;
  if(dir)coolAdvance(`temp-${dir}-${l.coolSequence.length}`);
  renderBoard();
  if(l.coolSequence.length===3){
    const plus=COOL_PLUS_SEQS.some(t=>t.every((n,i)=>n===l.coolSequence[i]));
    const minus=COOL_MINUS_SEQS.some(t=>t.every((n,i)=>n===l.coolSequence[i]));
    if(plus||minus){
      document.querySelectorAll('.coolTemp.selected').forEach(c=>c.classList.add('solvePulse'));
      state.busy=true;setTimeout(()=>{
        if(!isLevel('cool'))return;
        if(plus)l.coolPlus=true;if(minus)l.coolMinus=true;l.coolSequence=[];state.busy=false;renderAll();
        const op=findSpecial(plus?'plus':'minus');if(op)spawnEffect(op.x,op.y,plus?'+':'−','timeFlash',380);
        say(plus?'＋':'−',600);
      },430);return;
    }
    setTimeout(()=>{if(isLevel('cool')){l.coolSequence=[];renderBoard()}},150);return;
  }
  if(!dir)setTimeout(()=>{if(isLevel('cool')){l.coolSequence=[];renderBoard()}},120);
}
function coolCorrectIngredient(machine,id){
  return machine==='minus'?(id==='cloudSun'||id==='cloud'):machine==='plus'?(id==='sun'||id==='rain'):false
}

      else if(special==='woodHearth')underlying=l.hearthLit?'🔥':'🪵';

function renderTorchBeam(){
  const l=state.level;if(!l.torchOn)return;let fx=null;for(const[k,id]of l.objects)if(id==='flashlight'){const[x,y]=k.split(',').map(Number);fx={x,y};break}if(!fx)return;
  const cells=[];let x=fx.x-1,y=fx.y+1;while(x>=0&&y<l.height){const k=key(x,y);if(l.walls.has(k)||l.breakables.has(k)||(l.doors.has(k)&&!l.openDoor))break;cells.push({x,y});if(l.specials.get(k)==='disco')break;x--;y++}if(!cells.length)return;
  const board=$('#board'),cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')),step=cell+2,last=cells[cells.length-1];
  const ox=fx.x*step+cell*.24-3,oy=fx.y*step+cell*.76,ex=last.x*step+cell*.5,ey=last.y*step+cell*.5,dx=ex-ox,dy=ey-oy;
  const line=document.createElement('div');line.id='beamLine';line.style.left=`${ox}px`;line.style.top=`${oy}px`;line.style.width=`${Math.hypot(dx,dy)}px`;line.style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;board.appendChild(line)
}
function renderInventory(){if(isLevel('market'))return renderMarketInventory();document.querySelector('.invLabel span').textContent='Inventory';const inv=$('#inventory');inv.innerHTML='';const ids=[...state.invOrder,...Object.keys(state.inventory).filter(id=>!state.invOrder.includes(id))];const entries=ids.filter(id=>(state.inventory[id]||0)>0).map(id=>[id,state.inventory[id]]);if(!entries.length){inv.innerHTML='<div class="emptyInv">empty</div>';return}entries.forEach(([id,n])=>{const b=document.createElement('button');b.className='invItem'+(state.selectedItem===id?' selected':'');b.dataset.item=id;b.innerHTML=`<span>${emojiOf(id)}</span>${n>1?`<span class="count">×${n}</span>`:''}`;b.addEventListener('click',()=>{if(state.busy)return;state.selectedItem=state.selectedItem===id?null:id;renderAll()});inv.appendChild(b)})}
function say(msg,ms=1300){const el=$('#status');clearTimeout(state.statusTimer);el.textContent=msg;el.style.opacity='1';if(ms)state.statusTimer=setTimeout(()=>{el.style.opacity='0'},ms)}
function isAdjacent(x1,y1,x2,y2){return Math.abs(x1-x2)+Math.abs(y1-y2)===1}
function isFloor(x,y){const l=state.level,k=key(x,y);return l.floors.has(k)&&!l.walls.has(k)&&!l.breakables.has(k)&&!l.lakes.has(k)}
function isMachineCell(x,y){const k=key(x,y),s=state.level.specials.get(k);if((s==='plus'||s==='minus')&&isLevel('cool')&&!coolOperatorUnlocked(s))return false;if((s==='plus'||s==='minus')&&state.level.objects.has(k))return false;return['plus','minus','hourglass','woodHearth'].includes(s)}
function occupied(x,y){const l=state.level,k=key(x,y);return l.objects.has(k)||(l.player.x===x&&l.player.y===y)}
function canPlaceSelectedAt(x,y){
  if(!state.selectedItem||!isFloor(x,y)||occupied(x,y)||state.level.doors.has(key(x,y)))return false;
  const k=key(x,y),sl=slotAt(k),sp=state.level.specials.get(k);
  if(isLevel('cool')&&sl&&['plus','minus'].includes(sl.machine)&&!coolOperatorUnlocked(sl.machine))return false;
  if(isLevel('finale')&&state.selectedItem==='sandglass'&&sp==='timePedestal')return isAdjacent(state.level.player.x,state.level.player.y,x,y);
  if(isLevel('finale')&&state.selectedItem==='butterfly'&&sp==='finalRelease')return isAdjacent(state.level.player.x,state.level.player.y,x,y)&&!state.level.finalFrogLured;
  if(isLevel('finale')&&state.selectedItem==='lipstick'&&(sp==='finalMirror'||sp==='finalMirrorFront'))return isAdjacent(state.level.player.x,state.level.player.y,x,y);
  if(isLevel('library')&&state.selectedItem==='glasses')return sl?.machine==='glasses'&&playerNearMachineZone('glasses')&&!state.level.libraryGlassesOn;
  if(isMachineCell(x,y))return false;
  if(state.selectedItem==='spark'){
    if(isLevel('fire')&&sl?.machine==='hearth'&&playerNearMachineZone('hearth')&&!state.level.hearthLit)return true;
    if(isLevel('time')&&k===getTntInputKey()&&isTntInputActive())return true;
    return false;
  }
  if(sl&&sl.role==='output')return false;if(['snow','chili','iceWater','waterSource','worm','button','pinDesk','clueBook','partyGate','disco','chair','timePedestal','finalRelease','finalMirror'].includes(sp))return false;return true
}
function isCollectibleObject(id){return !['iceBlock','ball','chicken','balloon','present'].includes(id)}
function isSolidSpecial(sp){return ['pinDesk','clueBook','disco','chair','goal'].includes(sp)}
function isPathPassable(x,y,goal=null){
  if(!isFloor(x,y)||isMachineCell(x,y))return false;const l=state.level,k=key(x,y);if(l.doors.has(k)&&!l.openDoor)return false;const obj=l.objects.get(k);if(obj&&!isCollectibleObject(obj))return false;const sp=l.specials.get(k);if(sp==='iceWater'&&state.face!=='🥶')return false;if(sp==='worm'||isSolidSpecial(sp))return false;if(sp==='partyGate'&&state.face!=='🥳')return false;return true;
}
function machineSpecial(machine){return({plus:'plus',minus:'minus',time:'hourglass',hearth:'woodHearth'})[machine]||machine}
function machineCells(machine){
  const cells=[];const op=findSpecial(machineSpecial(machine));if(op)cells.push(op);
  for(const[k,v]of state.level.slots){if(v.machine===machine){const[x,y]=k.split(',').map(Number);cells.push({x,y})}}
  return cells;
}
function playerNearMachineZone(machine){
  const p=state.level.player;
  return machineCells(machine).some(c=>Math.abs(p.x-c.x)+Math.abs(p.y-c.y)<=1);
}
function isSlotActive(k,slot){
  if(isLevel('cool')&&['plus','minus'].includes(slot.machine)&&!coolOperatorUnlocked(slot.machine))return false;
  if(isLevel('finale')&&slot.machine==='time'&&!state.level.finalTimeActive)return false;
  if(state.level.objects.has(k))return false;
  if(slot.machine==='hearth'&&state.level.hearthLit)return false;
  if(slot.machine==='glasses')return isLevel('library')&&hasInv('glasses')&&!state.level.libraryGlassesOn&&playerNearMachineZone('glasses');
  return playerNearMachineZone(slot.machine);
}
function isTntPadCue(k){if(!isLevel('time'))return false;const l=state.level,p=l.def.tntPad;if(!p||l.caveOpened||l.objects.has(p)||!hasInv('tnt'))return false;const[x,y]=p.split(',').map(Number);return k===p&&Math.abs(l.player.x-x)+Math.abs(l.player.y-y)<=2}
function getTntInfo(){const l=state.level;if(!l||!isLevel('time'))return null;for(const[k,id]of l.objects)if(id==='tnt'){const[x,y]=k.split(',').map(Number);return{x,y,k}}return null}
function assignTntInput(x,y){const l=state.level;l.tntInput=null;for(const[dx,dy]of[[0,-1],[-1,0],[1,0],[0,1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(isFloor(nx,ny)&&!l.objects.has(k)&&!l.doors.has(k)&&!isMachineCell(nx,ny)&&!l.specials.get(k)&&!(l.player.x===nx&&l.player.y===ny)){l.tntInput=k;break}}}
function getTntInputKey(){const t=getTntInfo();if(!t)return null;return state.level.tntInput}
function isTntInputActive(){const t=getTntInfo(),ik=getTntInputKey();if(!t||!ik||!hasInv('spark'))return false;const[ix,iy]=ik.split(',').map(Number),p=state.level.player;return Math.min(Math.abs(p.x-t.x)+Math.abs(p.y-t.y),Math.abs(p.x-ix)+Math.abs(p.y-iy))<=1}
function onCellTap(x,y){
  if(Date.now()<state.suppressClickUntil||state.busy)return;
  const p=state.level.player,k=key(x,y),sl=slotAt(k);
  if(isLevel('library')&&state.level.walls.has(k)&&state.level.def.coloredBooks?.[k]){tapLibraryBook(k);return}
  if(state.selectedItem==='pin'&&state.level.objects.get(k)==='balloon'&&isAdjacent(p.x,p.y,x,y)){popPartyBalloon(x,y);return;}
  if(isLevel('finale')&&state.selectedItem==='lipstick'&&x===p.x&&y===p.y){
    const m=findSpecial('finalMirror');
    if(m&&isAdjacent(p.x,p.y,m.x,m.y)){applyFinalLipstick(p.x,p.y);return}
  }
  if(isLevel('finale')&&state.selectedItem&&['sandglass','butterfly','lipstick'].includes(state.selectedItem)&&canPlaceSelectedAt(x,y)){placeSelected(x,y);return;}
  if(!state.selectedItem||!canPlaceSelectedAt(x,y))return;
  // Machine inputs can be filled from anywhere around the local machine cluster.
  if(sl&&['plus','minus','time','hearth','glasses'].includes(sl.machine)&&playerNearMachineZone(sl.machine)){placeSelected(x,y);return}
  if(state.selectedItem==='spark'&&k===getTntInputKey()&&isTntInputActive()){placeSelected(x,y);return}
  if(isAdjacent(p.x,p.y,x,y))placeSelected(x,y);
}

function moveOne(dx,dy){
  if(isLevel('finale'))return finaleMove(dx,dy);
  if(isLevel('market'))return marketMove(dx,dy);
  if(isLevel('horse'))return horseMove(dx,dy);
  if(isLevel('mirror'))return mirrorMove(dx,dy);
  if(state.busy)return false;const l=state.level,nx=l.player.x+dx,ny=l.player.y+dy,nk=key(nx,ny);
  if(isLevel('fire')&&fireKeeperAt(nx,ny))return false;

  if(isLevel('cool')){const sp=l.specials.get(nk);if(sp?.startsWith('coolDay'))return false;if(sp?.startsWith('coolTemp')){coolBumpTemp(nx,ny,sp);return false}}

  }

  if(special==='clueBook'){readLibraryClue();return false}
  if(special==='disco'||special==='chair'||special==='goal')return false;
  if(special==='partyGate'&&l.partyPopped)return false;
  if(special==='partyGate'&&state.face!=='🥳'){say('PARTY GOERS ONLY',1500);return false}
  if(isMachineCell(nx,ny))return false;if(special==='worm')return false;
  if(special==='iceWater'){
    if(state.face!=='🥶'){say('💧',500);return false}
    const bx=nx+dx,by=ny+dy;if(!isFloor(bx,by)||occupied(bx,by)||l.doors.has(key(bx,by))){say('NO ROOM FOR 🧊',900);return false}
    l.player={x:nx,y:ny};state.face='🙂';l.objects.set(key(bx,by),'iceBlock');say('🥶 + 💧 → 🧊',700);renderAll();return true;
  }
  l.player={x:nx,y:ny};
  if(special==='snow'){
    if(state.face==='🥵'){state.face='🙂';say('🙂',320)}
    else if(state.face==='🙂'){state.face='🥶';say('🥶',450)}
  }
  if(special==='chili'){
    if(state.face==='🥶'){state.face='🙂';say('🙂',320)}
    else if(state.face==='🙂'){state.face='🥵';say('🥵',450)}
  }

function marketIsShelf(x,y){return y>=2&&y<=11&&(x===1||x===4||x===5||x===8)}
function marketIsFloor(x,y){return x>0&&x<9&&y>0&&y<13&&!marketIsShelf(x,y)}
function marketShelfAccessible(x,dx){if(x===1)return dx===-1;if(x===4)return dx===1;if(x===5)return dx===-1;if(x===8)return dx===1;return false}
function marketVisibleTotal(n){return n>200?'>$200':`$${n}`}
function marketCategoryForProduct(p){return Object.keys(MARKET_CATEGORIES).find(c=>MARKET_CATEGORIES[c].includes(p))}
function marketFaceById(id){return MARKET_FACES.find(f=>f.id===id)}
function marketBuildSections(){
  const m=state.level.market,by={3:[],4:[],5:[],6:[],7:[]};
  Object.keys(MARKET_CATEGORIES).forEach(c=>by[MARKET_CATEGORIES[c].length].push(c));Object.values(by).forEach(a=>{const s=shuffle(a);a.splice(0,a.length,...s)});
  const pairs=[[by[6].pop(),by[4].pop()],[by[6].pop(),by[4].pop()],[by[5].pop(),by[5].pop()],[by[7].pop(),by[3].pop()]],faces=shuffle(MARKET_FACES);
  m.sections=[];m.sectionBreaks={};
  faces.forEach((f,i)=>{let y=2;shuffle(pairs[i]).forEach((cat,j)=>{const len=MARKET_CATEGORIES[cat].length;m.sections.push({category:cat,faceId:f.id,x:f.x,aisle:f.aisle,start:y,end:y+len-1});if(j===1)m.sectionBreaks[f.x]=y;y+=len})})
}
function marketChooseRequired(){
  const m=state.level.market;let a,b;
  if(m.roundIndex===0){[a,b]=shuffle(m.sections).slice(0,2)}
  else{
    const left=m.sections.filter(s=>s.aisle==='L'),right=m.sections.filter(s=>s.aisle==='R'),pairs=[];
    left.forEach(l=>right.forEach(r=>pairs.push({l,r,spread:Math.abs((l.start+l.end-r.start-r.end)/2)})));
    pairs.sort((x,y)=>y.spread-x.spread);const p=pairs[Math.floor(Math.random()*Math.min(4,pairs.length))];a=p.l;b=p.r
  }
  m.required=[a,b].map(s=>{const arr=MARKET_CATEGORIES[s.category];return arr[Math.floor(Math.random()*arr.length)]})
}
function marketBuildStock(){
  const m=state.level.market;m.stock={};m.taken={};
  m.sections.forEach(sec=>{
    let items=shuffle(MARKET_CATEGORIES[sec.category]),req=m.required.find(p=>marketCategoryForProduct(p)===sec.category);
    if(req){items=items.filter(p=>p!==req);items.splice(Math.floor(Math.random()*(items.length+1)),0,req)}
    if(m.roundIndex===2&&items.length>2){
      // Keep the exact layout unpredictable, but make one valuable choice in each section tend toward its farther end.
      const hi=[...items].sort((a,b)=>MARKET_PRICE[b]-MARKET_PRICE[a])[0],i=items.indexOf(hi);if(i>0&&Math.random()<.65)[items[0],items[i]]=[items[i],items[0]]
    }
    for(let y=sec.start,i=0;y<=sec.end;y++,i++)m.stock[key(sec.x,y)]=items[i]
  })
}

}

/* ---------- HORSE PADDOCK ---------- */
const HORSE_DIR_NAME=(dx,dy)=>dx===1?'R':dx===-1?'L':dy===1?'D':'U',HORSE_INV={U:'D',D:'U',L:'R',R:'L'},HORSE_VEC={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function horseTargetHas(x,y){return horsePenHas(x,y)}
function horsePenHas(x,y){return (state.level.def.horsePen||state.level.def.horseTarget).includes(key(x,y))}
function renderHorseBoard(){
  const l=state.level,board=$('#board');board.classList.remove('partyDisco');board.innerHTML='';
  for(let y=0;y<l.height;y++)for(let x=0;x<l.width;x++){
    const k=key(x,y),cell=document.createElement('div');cell.className='cell';cell.dataset.x=x;cell.dataset.y=y;
    if(l.voids.has(k)){if(isLevel('cool')){cell.classList.add('coolBrick');coolBrickStyle(cell,x,y)}else cell.classList.add('void');board.appendChild(cell);continue}
    if(l.walls.has(k)){cell.classList.add('wall','horseWall');cell.innerHTML='<span class="emoji">🪵</span>'}
    else if(l.doors.has(k)&&!l.openDoor){cell.classList.add('door');cell.innerHTML='<span class="emoji">🚪</span>'}
    else{cell.classList.add('floor',horsePenHas(x,y)?'horseTarget':'horseGrass');
      if(l.horse&&l.horse.x===x&&l.horse.y===y)cell.innerHTML='<span class="emoji horseActor">🐴</span>';
      if(l.player.x===x&&l.player.y===y)cell.innerHTML=`<span class="emoji player">${state.face}</span>`
    }
    board.appendChild(cell)
  }
}
function horseValidCommand(a){if(a.length!==3)return false;const[A,B,C]=a,va=HORSE_VEC[A],vb=HORSE_VEC[B],perp=(x,y)=>HORSE_VEC[x][0]*HORSE_VEC[y][0]+HORSE_VEC[x][1]*HORSE_VEC[y][1]===0;return(A===B&&B!==C&&perp(B,C))||(A!==B&&B===C&&perp(A,B))}
function horseUsefulPrefix(a){if(a.length===1)return true;if(a.length!==2)return false;const[A,B]=a;return A===B||(HORSE_VEC[A][0]*HORSE_VEC[B][0]+HORSE_VEC[A][1]*HORSE_VEC[B][1]===0)}
function horseFeedMove(d){
  const l=state.level;l.horseBuffer.push(d);
  if(l.horseBuffer.length>=3&&horseValidCommand(l.horseBuffer.slice(-3))){const cmd=l.horseBuffer.slice(-3).map(x=>HORSE_INV[x]);l.horseBuffer=[];horseExecute(cmd);return}
  const last2=l.horseBuffer.slice(-2);l.horseBuffer=last2.length===2&&horseUsefulPrefix(last2)?last2:[l.horseBuffer[l.horseBuffer.length-1]]
}
function horseEngageIfNear(){const l=state.level;if(l.horseSolved||l.horseEngaged||!l.horse)return false;if(Math.abs(l.player.x-l.horse.x)+Math.abs(l.player.y-l.horse.y)<=1){l.horseEngaged=true;l.horseBuffer=[];state.face='🤠';renderAll();spawnEffect(l.player.x,l.player.y,'🤠','timeFlash',330);return true}return false}
function horseExecute(seq){
  const l=state.level;if(state.busy||!l.horseEngaged||l.horseSolved)return;let p={...l.horse},path=[],blocked=false;
  for(const d of seq){const[dx,dy]=HORSE_VEC[d],np={x:p.x+dx,y:p.y+dy},nk=key(np.x,np.y);if(!isFloor(np.x,np.y)||l.doors.has(nk)){blocked=true;break}path.push(np);p=np}
  if(blocked){const c=getCell(l.horse.x,l.horse.y);c?.querySelector('.emoji')?.classList.add('horseJiggle');setTimeout(()=>c?.querySelector('.emoji')?.classList.remove('horseJiggle'),300);return}
  const solveHorse=()=>{
    if(l.horseSolved)return;
    l.horseSolved=true;l.horseEngaged=false;l.horseBuffer=[];state.face='🙂';state.busy=false;renderAll();animateDoorOpen('');queueSave()
  };
  state.busy=true;let i=0;const step=()=>{
    if(i>=path.length){state.busy=false;if(horsePenHas(l.horse.x,l.horse.y))solveHorse();else queueSave();return}
    l.horse={...path[i++]};renderBoard();getCell(l.horse.x,l.horse.y)?.querySelector('.emoji')?.classList.add('horseHop');
    if(horsePenHas(l.horse.x,l.horse.y)){setTimeout(solveHorse,110);return}
    setTimeout(step,175)
  };setTimeout(step,70)
}
function horseMove(dx,dy){
  const l=state.level;if(state.busy)return false;const nx=l.player.x+dx,ny=l.player.y+dy,nk=key(nx,ny);
  if(l.doors.has(nk)){if(l.openDoor){l.player={x:nx,y:ny};renderBoard();markLevelComplete(state.levelIndex);setTimeout(nextLevel,150);return true}return false}
  if(!isFloor(nx,ny)||(l.horse&&l.horse.x===nx&&l.horse.y===ny))return false;
  const wasEngaged=l.horseEngaged;l.player={x:nx,y:ny};renderAll();if(!wasEngaged){horseEngageIfNear();return true}if(l.horseEngaged&&!l.horseSolved)horseFeedMove(HORSE_DIR_NAME(dx,dy));return true
}

/* ---------- MIRROR MAZE ---------- */
function mirrorButtons(){return state.level.def.mirrorButtons.map(([x,y])=>({x,y,k:key(x,y)}))}
function mirrorPanelCells(p,o=p.o,cx=p.cx,cy=p.cy){return o==='h'?[[cx-1,cy],[cx,cy],[cx+1,cy]]:[[cx,cy-1],[cx,cy],[cx,cy+1]]}
function mirrorPanelIndexAt(x,y,panels=state.level.mirrorPanels){for(let i=0;i<panels.length;i++)if(mirrorPanelCells(panels[i]).some(([a,b])=>a===x&&b===y))return i;return-1}
function mirrorBlocksRay(x,y,sourcePanel){
  const l=state.level,k=key(x,y);if(l.walls.has(k))return true;if(l.doors.has(k)&&!l.openDoor)return true;const i=mirrorPanelIndexAt(x,y);return i>=0&&i!==sourcePanel
}
function mirrorReflectPoint(pt,i){
  const l=state.level,p=l.mirrorPanels[i],x=pt.x,y=pt.y;
  if(p.o==='v'){
    if(y<p.cy-1||y>p.cy+1||x===p.cx)return null;const rx=2*p.cx-x;if(rx<=0||rx>=l.width-1)return null;
    const s1=p.cx>x?1:-1;for(let xx=x+s1;xx!==p.cx;xx+=s1)if(mirrorBlocksRay(xx,y,i))return null;
    const s2=rx>p.cx?1:-1;for(let xx=p.cx+s2;;xx+=s2){if(mirrorBlocksRay(xx,y,i))return null;if(xx===rx)break}
    return{x:rx,y,fx:!pt.fx,fy:!!pt.fy}
  }
  if(x<p.cx-1||x>p.cx+1||y===p.cy)return null;const ry=2*p.cy-y;if(ry<=0||ry>=l.height-1)return null;
  const s1=p.cy>y?1:-1;for(let yy=y+s1;yy!==p.cy;yy+=s1)if(mirrorBlocksRay(x,yy,i))return null;
  const s2=ry>p.cy?1:-1;for(let yy=p.cy+s2;;yy+=s2){if(mirrorBlocksRay(x,yy,i))return null;if(yy===ry)break}
  return{x,y:ry,fx:!!pt.fx,fy:!pt.fy}
}
function mirrorReflections(){
  const l=state.level,out=[],q=[{pt:{x:l.player.x,y:l.player.y,fx:false,fy:false},depth:0,last:-1,path:''}],seen=new Set();
  while(q.length){const cur=q.shift();if(cur.depth>=3)continue;for(let i=0;i<l.mirrorPanels.length;i++){if(i===cur.last)continue;const r=mirrorReflectPoint(cur.pt,i);if(!r)continue;const path=cur.path+l.mirrorPanels[i].id,sig=`${r.x},${r.y},${r.fx?1:0},${r.fy?1:0},${path}`;if(seen.has(sig))continue;seen.add(sig);const item={...r,depth:cur.depth+1,path};out.push(item);q.push({pt:r,depth:cur.depth+1,last:i,path})}}
  return out
}
function renderMirrorBoard(){
  const l=state.level,board=$('#board'),refs=mirrorReflections(),refPos=new Set(refs.map(r=>key(r.x,r.y)));board.classList.remove('partyDisco');board.innerHTML='';
  for(let y=0;y<l.height;y++)for(let x=0;x<l.width;x++){
    const k=key(x,y),cell=document.createElement('div');cell.className='cell';cell.dataset.x=x;cell.dataset.y=y;
    if(l.walls.has(k)){cell.classList.add('wall');cell.innerHTML='<span class="emoji">⬛</span>'}
    else if(l.doors.has(k)&&!l.openDoor){cell.classList.add('door','mirrorDoorClosed');cell.innerHTML='<span class="emoji">🚪</span>'}
    else if(l.doors.has(k)&&l.openDoor){cell.classList.add('floor','mirrorExitOpen');cell.innerHTML='<span class="emoji">➡️</span>'}
    else{cell.classList.add('floor');const b=mirrorButtons().find(v=>v.k===k);if(b){cell.classList.add('button');if(refPos.has(k))cell.classList.add('mirrorButtonOn');cell.innerHTML='<span class="emoji">🔘</span>'}}
    const pi=mirrorPanelIndexAt(x,y);if(pi>=0){cell.classList.remove('button');cell.classList.add('mirrorPanel');cell.dataset.mirrorPanel=pi;cell.innerHTML='<span class="emoji">🪞</span>'}
    board.appendChild(cell)
  }
  refs.forEach(r=>{const c=getCell(r.x,r.y);if(!c||c.classList.contains('wall'))return;const s=document.createElement('span');s.className='emoji mirrorGhost'+(r.depth>=2?' deep':'');s.textContent='🙂';s.style.transform=`scale(${r.fx?-1:1},${r.fy?-1:1})`;c.appendChild(s)});
  const pc=getCell(l.player.x,l.player.y);if(pc){const s=document.createElement('span');s.className='emoji player mirrorPlayer';s.textContent='🙂';pc.appendChild(s)}
}
function mirrorSolidForPanel(x,y,ignore){
  const l=state.level,k=key(x,y);if(l.walls.has(k)||l.doors.has(k)||mirrorButtons().some(b=>b.k===k)||(l.player.x===x&&l.player.y===y))return true;
  for(let i=0;i<l.mirrorPanels.length;i++){if(i===ignore)continue;if(mirrorPanelCells(l.mirrorPanels[i]).some(([a,b])=>a===x&&b===y))return true}return false
}
function mirrorCanTranslate(i,dx,dy){const p=state.level.mirrorPanels[i];return mirrorPanelCells(p,p.o,p.cx+dx,p.cy+dy).every(([x,y])=>!mirrorSolidForPanel(x,y,i))}
function mirrorCanRotate(i,hit,dx,dy){
  const p=state.level.mirrorPanels[i],no=p.o==='h'?'v':'h';if(!mirrorPanelCells(p,no).every(([x,y])=>!mirrorSolidForPanel(x,y,i)))return false;let sweep;
  if(p.o==='h'){if(dx!==0||![0,2].includes(hit))return false;const ex=hit===0?-1:1;sweep=[[p.cx+ex,p.cy+dy],[p.cx-ex,p.cy-dy]]}
  else{if(dy!==0||![0,2].includes(hit))return false;const ey=hit===0?-1:1;sweep=[[p.cx+dx,p.cy+ey],[p.cx-dx,p.cy-ey]]}
  return sweep.every(([x,y])=>!mirrorSolidForPanel(x,y,i))
}
function mirrorJiggle(i){document.querySelectorAll(`.cell[data-mirror-panel="${i}"]`).forEach(c=>{c.classList.remove('mirrorRefuse');void c.offsetWidth;c.classList.add('mirrorRefuse')})}
function mirrorCheckSolved(){
  const l=state.level;if(l.openDoor||l.mirrorUnlocking)return;const pos=new Set(mirrorReflections().map(r=>key(r.x,r.y)));if(mirrorButtons().every(b=>pos.has(b.k))){l.mirrorUnlocking=true;setTimeout(()=>{if(isLevel('mirror'))animateDoorOpen('')},80)}
}
function mirrorMove(dx,dy){
  const l=state.level;if(state.busy)return false;const nx=l.player.x+dx,ny=l.player.y+dy,nk=key(nx,ny),i=mirrorPanelIndexAt(nx,ny);
  if(i>=0){
    const p=l.mirrorPanels[i],cells=mirrorPanelCells(p),hit=cells.findIndex(([a,b])=>a===nx&&b===ny),along=(p.o==='h'&&dy===0)||(p.o==='v'&&dx===0),perp=(p.o==='h'&&dx===0)||(p.o==='v'&&dy===0),translate=along||(perp&&hit===1),rotate=perp&&(hit===0||hit===2);
    if(translate){
      if(!mirrorCanTranslate(i,dx,dy)){mirrorJiggle(i);return false}
      p.cx+=dx;p.cy+=dy;l.player={x:nx,y:ny};renderAll();mirrorCheckSolved();return true
    }
    if(rotate){
      if(!mirrorCanRotate(i,hit,dx,dy)){mirrorJiggle(i);return false}
      p.o=p.o==='h'?'v':'h';if(mirrorPanelIndexAt(nx,ny)<0)l.player={x:nx,y:ny};renderAll();mirrorCheckSolved();return true
    }
    mirrorJiggle(i);return false
  }
  if(l.doors.has(nk)){
    if(l.openDoor){l.player={x:nx,y:ny};renderBoard();markLevelComplete(state.levelIndex);setTimeout(nextLevel,150);return true}
    return false
  }
  if(!isFloor(nx,ny))return false;l.player={x:nx,y:ny};renderAll();mirrorCheckSolved();return true
}

function spawnEffect(x,y,emoji,cls,duration){const cell=getCell(x,y);if(!cell)return;const s=document.createElement('span');s.className=`fx ${cls||''}`;s.textContent=emoji;cell.appendChild(s);setTimeout(()=>s.remove(),duration||400)}
function getCell(x,y){return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`)}
function nextLevel(){if(state.levelIndex<LEVELS.length-1){state.highestReached=Math.max(state.highestReached,state.levelIndex+1);loadLevel(state.levelIndex+1,true)}else finishGame()}
function finishGame(){markLevelComplete(state.levelIndex);state.busy=true;const inv=[...state.invOrder,...Object.keys(state.inventory).filter(id=>!state.invOrder.includes(id))].filter(id=>state.inventory[id]>0).map(id=>[id,state.inventory[id]]).map(([id,n])=>`${emojiOf(id)}${n>1?'×'+n:''}`).join(' ');$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">🚪✨</div><div class="modalTitle">JOURNEY COMPLETE</div><div class="modalText">${inv?`You finished with ${inv}`:'You made it out.'}</div><button class="primary" id="again">PLAY AGAIN</button></div></div>`;setTimeout(()=>{$('#again').onclick=()=>{clearProgress();state.inventory={};state.invOrder=[];state.completed=new Set();state.highestReached=0;state.savedLevels={};$('#overlayRoot').innerHTML='';state.busy=false;loadLevel(0,false)}},650)}

function showJourneyIntro(){
  state.busy=true;
  $('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">👸 🏠 🤴</div><div class="modalTitle">HOMEWARD</div><div class="modalText">Find your way home to Prince Andrew.</div><button class="primary" id="journeyGo">BEGIN</button></div></div>`;
  $('#journeyGo').onclick=()=>{state.busy=false;closeOverlay();say(LEVELS[0].messages?.intro||'',1200)}
}

function showHelp(){const market=isLevel('market'),text=market?'Place 4 items in your trolley including the two required items and return to the counter. Be quick.':isLevel('horse')?'MOVE':isLevel('mirror')?'MOVE':`Move with the arrows.<br>Walk over items to collect them.<br>Tap inventory items to use them.`;$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><button class="modalClose" id="modalX">×</button><div class="modalBig">${market?'🛒':state.face}</div><div class="modalTitle">${market?'MARKET RUN':'ESCAPE'}</div><div class="helpText">${text}</div><button class="primary" id="helpClose">PLAY</button></div></div>`;$('#helpClose').onclick=closeOverlay;$('#modalX').onclick=closeOverlay;bindBackdropClose()}
function jumpLevel(delta){
  const ni=state.levelIndex+delta;if(ni<0||ni>=LEVELS.length)return;
  if(delta>0&&!TEST_UNLOCK_ALL&&ni>state.highestReached){say('ROOM NOT REACHED YET',850);return}
  loadLevel(ni,true);if(!isLevel('market'))say(state.completed.has(ni)?'ROOM COMPLETE':`ROOM ${ni+1}`,500)
}

let dpadDelay=null,dpadRepeat=null,dpadPointer=null;
function stopDpad(){
  if(dpadDelay)clearTimeout(dpadDelay);
  if(dpadRepeat)clearInterval(dpadRepeat);
  dpadDelay=dpadRepeat=null;dpadPointer=null;
}
document.querySelectorAll('.dpad button[data-move]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    stopDpad();
    dpadPointer=e.pointerId;
    const[dx,dy]=btn.dataset.move.split(',').map(Number);
    if(!state.busy)moveOne(dx,dy);
    dpadDelay=setTimeout(()=>{
      dpadRepeat=setInterval(()=>{if(!state.busy)moveOne(dx,dy)},115);
    },260);
  });
  btn.addEventListener('click',e=>e.preventDefault());
});
window.addEventListener('pointerup',stopDpad,{passive:true});
window.addEventListener('pointercancel',stopDpad,{passive:true});
window.addEventListener('touchend',stopDpad,{passive:true});
window.addEventListener('touchcancel',stopDpad,{passive:true});
window.addEventListener('blur',stopDpad);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')stopDpad()});
$('#resetBtn').addEventListener('click',resetRoom);$('#helpBtn').addEventListener('click',showHelp);$('#prevLevel').addEventListener('click',()=>jumpLevel(-1));$('#nextLevel').addEventListener('click',()=>jumpLevel(1));window.addEventListener('resize',()=>{sizeBoard();renderBoard()});window.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(m[e.key]){e.preventDefault();moveOne(...m[e.key])}});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<320)e.preventDefault();lastTouchEnd=now},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#app'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('#app'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.closest('#app'))e.preventDefault()});
window.addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
const saved=readProgress();
if(saved){
  state.inventory=saved.inventory||{};state.invOrder=Array.isArray(saved.invOrder)?saved.invOrder:[];state.completed=new Set(saved.completed||[]);
  state.highestReached=Math.max(0,Math.min(LEVELS.length-1,saved.highestReached||0));state.savedLevels=saved.levels||{};
  state.entryInventory=saved.entryInventory||clone(state.inventory);state.entryInvOrder=Array.isArray(saved.entryInvOrder)?saved.entryInvOrder:[...state.invOrder];
  const start=Math.max(0,Math.min(LEVELS.length-1,saved.currentLevel||0));loadLevel(start,true,{resumeCurrent:true,resumeFace:saved.face||'🙂',silent:true});if(!isLevel('market'))say('PROGRESS RESTORED',700);else marketUpdateStatus()
}else{loadLevel(0,false,{silent:true});setTimeout(showJourneyIntro,120)};
})();
