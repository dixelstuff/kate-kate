<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#101114" />
<title>Emoji Escape — 6 Room Demo v7</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#23262d;--text:#f6f7f9;--muted:#9ca2ad;
  --cell:42px;--gap:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100svh;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7px) 8px calc(env(safe-area-inset-bottom) + 7px);gap:7px}
.topbar{width:min(100%,580px);display:grid;grid-template-columns:40px 32px 1fr 32px 40px;gap:3px;align-items:center;min-height:40px}
.iconbtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--panel);color:#fff;font-size:21px;display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.95)}.levelnav{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.035);font-size:22px}
.heading{text-align:center;line-height:1.05;min-width:0}.levelname{font-size:15px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.levelnum{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
#status{width:min(100%,580px);min-height:45px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1.15;color:#f0f1f4;text-align:center;transition:opacity .15s}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;gap:var(--gap);position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center;border-radius:9px;font-size:calc(var(--cell)*.66);line-height:1;background:rgba(255,255,255,.034);overflow:visible}
.cell.floor{box-shadow:inset 0 0 0 1px rgba(255,255,255,.022)}.cell.void{background:transparent;box-shadow:none;pointer-events:none}.cell.wall{background:rgba(255,255,255,.016);font-size:calc(var(--cell)*.61)}.cell.breakable{background:rgba(255,255,255,.025)}.cell.door{background:rgba(255,255,255,.055)}
.cell.lake{background:rgba(62,138,190,.08);font-size:calc(var(--cell)*.64)}.cell.lake .emoji{animation:waterBob 1.8s ease-in-out infinite}@keyframes waterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cell.machine{background:rgba(255,255,255,.034);box-shadow:inset 0 0 0 1px rgba(255,255,255,.022)}
.operatorGlyph{position:relative;z-index:2;font-size:calc(var(--cell)*.72);font-weight:900;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.cell.slotActive{box-shadow:inset 0 0 0 1px rgba(214,230,240,.07);background:rgba(214,230,240,.008)}
.emoji{position:relative;z-index:2;display:block;transform-origin:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}.player{z-index:5;animation:playerIn .10s ease-out}@keyframes playerIn{from{transform:scale(.86)}to{transform:scale(1)}}
.placeable{}.sourceGlow{animation:sourceGlow 1.45s ease-in-out infinite}@keyframes sourceGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.depleted{opacity:.22}.machineReact{animation:machineReact .27s ease-in-out}@keyframes machineReact{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.bottomBar{width:min(100%,580px);display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:end}.dpad{width:108px;height:108px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:3px;align-self:end}.dpad button{border:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:10px;background:var(--panel2);color:#fff;font-size:20px;font-weight:800;padding:0;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}.dpad button:active{transform:scale(.92);background:#30343d}.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.dpadCore{grid-column:2;grid-row:2;border-radius:11px;background:rgba(255,255,255,.035)}.inventoryWrap{width:100%;min-width:0;background:var(--panel);border-radius:16px;padding:8px 9px 9px;box-shadow:0 -1px 0 rgba(255,255,255,.04)}.invLabel{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 3px 6px}#inventory{min-height:48px;display:flex;gap:7px;overflow-x:auto;align-items:center;scrollbar-width:none}#inventory::-webkit-scrollbar{display:none}.invItem{border:0;border-radius:12px;background:var(--panel2);height:46px;min-width:46px;padding:0 8px;color:white;font-size:27px;display:flex;align-items:center;justify-content:center;gap:3px;position:relative}.invItem .count{font-size:11px;font-weight:800;color:#dfe1e6;align-self:flex-end;margin-bottom:7px}.invItem.selected{outline:2px solid rgba(255,255,255,.78);transform:translateY(-2px)}.emptyInv{color:#717680;font-size:13px;padding-left:5px}#hint{font-size:10px;color:#7d828c;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{position:absolute;z-index:12;display:grid;place-items:center;pointer-events:none;font-size:calc(var(--cell)*.78);line-height:1;left:0;top:0;width:100%;height:100%}.tntPulse{animation:tntPulse .18s ease-in-out 3}@keyframes tntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}.boomCenter{animation:boomCenter .28s ease-out forwards}@keyframes boomCenter{0%{transform:scale(.72);opacity:1}45%{transform:scale(1.38);opacity:1}100%{transform:scale(.55);opacity:.08}}.boomOuter{animation:boomOuter .44s ease-out forwards}@keyframes boomOuter{0%{transform:scale(.12);opacity:.12}42%{transform:scale(1.2);opacity:1}100%{transform:scale(.88);opacity:0}}.candleFly{animation:candleFly .28s ease-in forwards}@keyframes candleFly{to{transform:translate(var(--dx),var(--dy)) rotate(38deg) scale(.52);opacity:0}}.chickenHop{animation:chickenHop .20s ease-in-out}@keyframes chickenHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.peck{animation:peck .15s ease-in-out 3}@keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg) translateY(2px)}}.timeFlash{animation:timeFlash .38s ease-out}@keyframes timeFlash{0%{transform:scale(.62) rotate(-12deg);opacity:.18}60%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}.splash{animation:splash .42s ease-out forwards}@keyframes splash{0%{transform:scale(.4);opacity:.2}50%{transform:scale(1.28);opacity:1}100%{transform:scale(.85);opacity:0}}
.travel{animation:travel var(--dur) linear forwards}@keyframes travel{0%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--tx),var(--ty)) scale(.96)}}
.doorDissolve .emoji{animation:doorDissolve .62s ease-out forwards}.doorDissolve{animation:doorCellFlash .62s ease-out forwards}@keyframes doorDissolve{0%{transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 1px 1px rgba(0,0,0,.25))}28%{transform:scale(1.22) rotate(-3deg);opacity:1;filter:blur(0) brightness(1.35)}100%{transform:scale(.52) rotate(9deg);opacity:0;filter:blur(8px) brightness(1.8)}}@keyframes doorCellFlash{0%,100%{background:rgba(255,255,255,.055)}35%{background:rgba(255,255,255,.22)}}.fadeInto{animation:fadeInto .18s ease-in forwards}@keyframes fadeInto{to{transform:translate(var(--tx),var(--ty)) scale(.52);opacity:0}}

.cell.beamCell{background:rgba(255,224,105,.085);box-shadow:inset 0 0 12px rgba(255,224,105,.08)}
.cell.tableCell{background:rgba(115,78,42,.13)}
.cell.discoOn .emoji{animation:discoSpin .8s linear infinite;filter:drop-shadow(0 0 7px rgba(255,255,255,.8))}
@keyframes discoSpin{0%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.08)}100%{transform:rotate(-7deg) scale(1)}}
.shelfSlide .emoji{animation:shelfSlide .34s ease-in forwards}@keyframes shelfSlide{to{transform:translateX(78%) rotate(8deg);opacity:0}}
.balloonPop{animation:balloonPop .22s ease-out forwards}@keyframes balloonPop{0%{transform:scale(1)}55%{transform:scale(1.35)}100%{transform:scale(.1);opacity:0}}
.presentSpawn{animation:presentSpawn .36s cubic-bezier(.2,.9,.25,1.25)}@keyframes presentSpawn{from{transform:scale(.15) rotate(-12deg);opacity:.2}to{transform:scale(1);opacity:1}}
.flyBack{position:fixed;z-index:80;pointer-events:none;font-size:30px;line-height:1;transition:transform .38s cubic-bezier(.25,.75,.3,1),opacity .38s ease}
.pinInput{width:100%;height:52px;border:0;border-radius:14px;background:#111318;color:#fff;font-size:24px;font-weight:850;letter-spacing:.28em;text-align:center;text-transform:uppercase;outline:none;margin:6px 0 12px;padding-left:.28em}
.pinHint{min-height:22px;color:#aeb3bc;font-size:12px;margin-bottom:8px}

.modal{position:fixed;inset:0;background:rgba(4,5,6,.82);backdrop-filter:blur(8px);z-index:50;display:grid;place-items:center;padding:24px}.modalCard{width:min(100%,420px);background:#202329;border-radius:24px;padding:25px 20px;text-align:center}.modalBig{font-size:48px;margin-bottom:8px}.modalTitle{font-size:23px;font-weight:850;margin-bottom:7px}.modalText{font-size:14px;color:#bfc3ca;line-height:1.45;margin-bottom:18px}.primary{border:0;border-radius:14px;background:#f2f3f5;color:#111318;height:48px;padding:0 22px;font-size:16px;font-weight:800;width:100%}.helpText{text-align:left;font-size:14px;line-height:1.55;color:#d0d3d9}.helpText b{color:white}
@media (max-height:700px){#app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px)}#status{min-height:38px;font-size:13px;padding:6px 11px}.bottomBar{grid-template-columns:96px minmax(0,1fr)}.dpad{width:96px;height:96px;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px)}.inventoryWrap{padding-top:6px;padding-bottom:6px}.invItem{height:42px;min-width:42px;font-size:25px}#hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><button class="iconbtn" id="helpBtn" aria-label="Help">?</button><button class="iconbtn levelnav" id="prevLevel" aria-label="Previous room">‹</button><div class="heading"><div class="levelname" id="levelName"></div><div class="levelnum" id="levelNum"></div></div><button class="iconbtn levelnav" id="nextLevel" aria-label="Next room">›</button><button class="iconbtn" id="resetBtn" aria-label="Reset room">↻</button></div>
  <div id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="bottomBar">
    <div class="dpad" aria-label="Movement controls">
      <button class="up" data-move="0,-1" aria-label="Move up">↑</button>
      <button class="left" data-move="-1,0" aria-label="Move left">←</button>
      <div class="dpadCore"></div>
      <button class="right" data-move="1,0" aria-label="Move right">→</button>
      <button class="down" data-move="0,1" aria-label="Move down">↓</button>
    </div>
    <div class="inventoryWrap"><div class="invLabel"><span>Inventory</span></div><div id="inventory"></div><div id="hint">Move • collect • use inventory • escape</div></div>
  </div>
</div>
<div id="overlayRoot"></div>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), key=(x,y)=>`${x},${y}`, dirs=[[1,0],[-1,0],[0,1],[0,-1]], clone=o=>JSON.parse(JSON.stringify(o));
const ITEMS={cloudSun:'🌥️',cloud:'☁️',water:'💧',sun:'☀️',rain:'🌧️',rainbow:'🌈',tnt:'🧨',candle:'🕯️',spark:'✨',puff:'💨',egg:'🥚',chick:'🐣',chicken:'🐔',keyNew:'🔑',keyOld:'🗝️',glasses:'👓',pin:'📌',flashlight:'🔦',balloon:'🎈',present:'🎁'};
const emojiOf=id=>ITEMS[id]||id;

const LEVELS=[
{
  name:'Rainbow Workshop',wallEmoji:'🌿',requirement:'rainbow',
  map:[
    '  #######  ',
    ' ##.....###',
    '##..#.....#',
    '#.........#',
    '#....##...#',
    '##........D',
    ' #..#......#',
    ' #.........#',
    ' ###....####',
    '   ######   '
  ],
  player:[2,7],objects:{'2,2':'cloudSun','7,2':'cloud','8,3':'rain'},
  specials:{'3,5':'minus','7,6':'plus'},
  slots:{'2,5':{machine:'minus',role:'left'},'4,5':{machine:'minus',role:'right'},'6,6':{machine:'plus',role:'left'},'8,6':{machine:'plus',role:'right'}},messages:{intro:''}
},
{
  name:'Iceworks',wallEmoji:'🪨',button:[7,3],
  map:['   ###D###  ','  ##......# ',' ##........#','#.........~~','#......#.~~~','##.....#.~~~',' #.....#.~~~',' #.......~~~',' ##........# ','  ##......## ','   ########  '],
  player:[4,8],objects:{'2,7':'tnt'},specials:{'3,8':'snow','5,8':'chili','2,3':'iceWater','8,8':'iceWater','7,3':'button'},
  lakes:['9,3','10,3','9,4','10,4','11,4','9,5','10,5','11,5','9,6','10,6','11,6','9,7','10,7','11,7'],extraWalls:['7,1','9,1','7,2','9,2','7,4','7,5','7,6'],messages:{intro:''}
},
{
  name:'Fire Yard',wallEmoji:'🌵',button:[8,2],
  map:['   ###D###   ','  ##.....##  ',' ##........# ','#..........# ','#..........##','#...........#','##..........#',' #..........#',' ##........##','  ########## '],
  player:[3,8],objects:{'3,7':'ball','9,7':'candle','9,5':'spark'},specials:{'2,6':'woodHearth','8,2':'button'},slots:{'2,5':{machine:'hearth',role:'spark'}},extraWalls:['9,4','8,1'],messages:{intro:''}
},
{
  name:'Old Future',wallEmoji:'🌲',
  map:['   #######  ',' ###.....D# ','##.........#','#....#.....#','#..........#','#..#.......#','#......#####','##.....#...#',' #.....#...#',' ###########'],
  player:[2,8],objects:{'2,3':'egg','9,8':'glasses'},specials:{'5,5':'hourglass','8,3':'worm'},slots:{'4,5':{machine:'time',role:'left'},'6,5':{machine:'time',role:'right'}},breakables:['7,8'],caveReward:[9,8,'glasses'],messages:{intro:''}
},
{
  name:'The Library',wallEmoji:'📚',
  map:['   #######   ','  ##.....### ',' ##......#..#','##.......#..#','#........#..#','#........#..D','#........#..#','##.......#..#',' ##......####','  #########  '],
  player:[2,7],objects:{},
  specials:{'3,6':'pinDesk','5,3':'clueBook','9,5':'secretShelf'},pinOutput:[4,6],messages:{intro:''}
},
{
  name:'Party Inside',wallEmoji:'🎀',flashDir:[1,0],
  map:['   #########   ','  #.........#  ',' #..###.####.# ',' #..#......#.# ','#...#.....##..#','#...#......D..#','#...#......#..#','#...#......#..#',' #..########.# ',' #...........# ',' #...........# ','   #########   '],
  player:[2,7],objects:{'3,9':'flashlight','9,4':'balloon'},
  specials:{'7,2':'partyGate','11,10':'disco'},
  presentLayout:['8,6','9,6','9,5','5,4','6,5','7,7','10,7','6,7'],messages:{intro:''}
}
];

const state={levelIndex:0,level:null,inventory:{},selectedItem:null,face:'🙂',busy:false,auto:false,statusTimer:null,entryInventory:{},roomSerial:0,suppressClickUntil:0,waveEpoch:performance.now(),moveHold:null};
function addInv(id,n=1){state.inventory[id]=(state.inventory[id]||0)+n;if(state.inventory[id]<=0)delete state.inventory[id];renderInventory()}
function takeInv(id,n=1){if((state.inventory[id]||0)<n)return false;state.inventory[id]-=n;if(state.inventory[id]<=0){delete state.inventory[id];if(state.selectedItem===id)state.selectedItem=null}renderInventory();return true}
function hasInv(id){return(state.inventory[id]||0)>0}

function parseLevel(def){
  const height=def.map.length,width=Math.max(...def.map.map(r=>r.length));
  const walls=new Set(),floors=new Set(),voids=new Set(),doors=new Set(),lakes=new Set(def.lakes||[]),breakables=new Set(def.breakables||[]);
  for(let y=0;y<height;y++){
    const row=def.map[y].padEnd(width,' ');
    for(let x=0;x<width;x++){
      const c=row[x],k=key(x,y);
      if(c==='#')walls.add(k);else if(c==='D'){doors.add(k);floors.add(k)}else if(c==='.')floors.add(k);else if(c==='~'){lakes.add(k)}else voids.add(k);
    }
  }
  (def.extraWalls||[]).forEach(k=>{walls.add(k);floors.delete(k)});
  lakes.forEach(k=>{floors.delete(k);walls.delete(k)});
  breakables.forEach(k=>{walls.delete(k);floors.add(k)});
  return{def,width,height,walls,floors,voids,doors,lakes,breakables,player:{x:def.player[0],y:def.player[1]},objects:new Map(Object.entries(def.objects||{})),specials:new Map(Object.entries(def.specials||{})),slots:new Map(Object.entries(def.slots||{})),openDoor:false,sourceReady:new Map(),caveOpened:false,hearthLit:false,shelfOpened:false,libraryClueKnown:false,pinSolved:false,pinAttempts:0,flashDir:def.flashDir?def.flashDir.slice():[1,0],partyReady:false,partyPopped:false};
}
function loadLevel(index,preserveInventory=true){
  state.levelIndex=index;state.level=parseLevel(LEVELS[index]);state.face='🙂';state.selectedItem=null;state.busy=false;state.auto=false;state.roomSerial++;
  if(!preserveInventory)state.inventory={};state.entryInventory=clone(state.inventory);
  $('#levelName').textContent=LEVELS[index].name;$('#levelNum').textContent=`ROOM ${index+1} / ${LEVELS.length}`;
  sizeBoard();renderAll();say(LEVELS[index].messages?.intro||'',0);
}
function resetRoom(){state.inventory=clone(state.entryInventory);loadLevel(state.levelIndex,true);say('ROOM RESET',850)}
function sizeBoard(){const l=state.level;if(!l)return;const maxW=Math.min(window.innerWidth-16,580),reserved=245,maxH=Math.max(250,window.innerHeight-reserved);const cell=Math.floor(Math.min(48,(maxW-(l.width-1)*2)/l.width,(maxH-(l.height-1)*2)/l.height));document.documentElement.style.setProperty('--cell',`${Math.max(26,cell)}px`);$('#board').style.gridTemplateColumns=`repeat(${l.width},var(--cell))`;$('#board').style.gridTemplateRows=`repeat(${l.height},var(--cell))`}
function renderAll(){renderBoard();renderInventory()}
function wallEmojiAt(k){return state.level.breakables.has(k)?'🪨':state.level.def.wallEmoji}
function slotAt(k){return state.level.slots.get(k)||null}
function renderBoard(){
  const l=state.level,board=$('#board');board.innerHTML='';const beam=getBeamCells();
  for(let y=0;y<l.height;y++)for(let x=0;x<l.width;x++){
    const k=key(x,y),cell=document.createElement('div');cell.className='cell';cell.dataset.x=x;cell.dataset.y=y;
    if(l.voids.has(k)){cell.classList.add('void');board.appendChild(cell);continue}
    if(beam.has(k))cell.classList.add('beamCell');
    if(l.lakes.has(k)){cell.classList.add('lake');const phase=((performance.now()-state.waveEpoch)+(x*137+y*83))%1800;cell.innerHTML=`<span class="emoji" style="animation-delay:-${phase}ms">🌊</span>`;board.appendChild(cell);continue}
    if(l.walls.has(k)||l.breakables.has(k)){cell.classList.add('wall');if(l.breakables.has(k))cell.classList.add('breakable');cell.innerHTML=`<span class="emoji">${wallEmojiAt(k)}</span>`;board.appendChild(cell);continue}
    cell.classList.add('floor');
    const special=l.specials.get(k),slot=slotAt(k);
    if(slot&&slot.role!=='output'&&isSlotActive(k,slot))cell.classList.add('slotActive')
    if(special==='button')cell.classList.add('button');
    if(['plus','minus','hourglass','woodHearth'].includes(special))cell.classList.add('machine');
    if(l.doors.has(k)&&!l.openDoor){cell.classList.add('door');cell.innerHTML='<span class="emoji">🚪</span>'}
    else{
      let underlying='';
      if(special==='plus')cell.innerHTML='<span class="operatorGlyph">+</span>';
      else if(special==='minus')cell.innerHTML='<span class="operatorGlyph">−</span>';
      else if(special==='snow')underlying='❄️';
      else if(special==='chili')underlying='🌶️';
      else if(special==='iceWater')underlying='💧';
      else if(special==='waterSource')underlying=(l.sourceReady.get(k)===false?'':'💧');
      else if(special==='woodHearth')underlying=l.hearthLit?'🔥':'🪵';
      else if(special==='hourglass')underlying='⏳';
      else if(special==='worm')underlying='🪱';
      else if(special==='button')underlying='🔘';
      else if(special==='pinDesk'){underlying='📝';cell.classList.add('tableCell')}
      else if(special==='clueBook')underlying='📖';
      else if(special==='partyGate')underlying=l.partyPopped?'🎁':'🎟️';
      else if(special==='disco'){underlying='🪩';if(l.partyReady)cell.classList.add('discoOn')}
      if(underlying)cell.innerHTML=`<span class="emoji ${['snow','chili','waterSource'].includes(special)?'sourceGlow':''}">${underlying}</span>`;
      const obj=l.objects.get(k);
      if(obj){const em=obj==='ball'?'⚽':obj==='iceBlock'?'🧊':emojiOf(obj);cell.innerHTML=`<span class="emoji">${em}</span>`}
      if(l.player.x===x&&l.player.y===y)cell.innerHTML=`<span class="emoji player">${state.face}</span>`;
    }
    cell.addEventListener('click',()=>onCellTap(x,y));board.appendChild(cell);
  }
}

function runTimeMachine(x,y,id){const l=state.level,h=findSpecial('hourglass');if(!h||y!==h.y||Math.abs(x-h.x)!==1)return;const dir=x<h.x?'future':'past',outX=x<h.x?h.x+1:h.x-1,outK=key(outX,h.y),inK=key(x,y),result=timeResult(id,dir);if(!result){say('⏳  NOTHING HAPPENS',750);return}if(l.objects.has(outK)||(l.player.x===outX&&l.player.y===h.y)){say('OTHER SIDE BLOCKED',900);return}state.busy=true;setTimeout(()=>{l.objects.delete(inK);spawnEffect(h.x,h.y,'⏳','timeFlash',340);setTimeout(()=>{l.objects.set(outK,result);if(result!=='chicken')state.busy=false;renderAll();spawnEffect(outX,h.y,emojiOf(result),'timeFlash',380);say(`${emojiOf(id)} → ${emojiOf(result)}`,650);if(result==='chicken')setTimeout(()=>startChicken(outX,h.y),300)},210)},100)}
function timeResult(id,dir){const future={egg:'chick',chick:'chicken'},past={chicken:'chick',chick:'egg',keyNew:'keyOld'};return dir==='future'?future[id]:past[id]}
function startChicken(x,y){const l=state.level,w=findSpecial('worm');if(!w)return;const path=findAgentPath({x,y},w);if(!path.length){say('🐔  CANNOT REACH 🪱',900);return}state.busy=true;let i=0,cur={x,y};const step=()=>{if(i>=path.length){const wk=key(w.x,w.y);spawnEffect(w.x,w.y,'🐔','peck',500);setTimeout(()=>{l.objects.delete(wk);l.specials.delete(wk);l.objects.set(wk,'keyNew');state.busy=false;renderAll();say('🔑',800)},430);return}const next=path[i++];l.objects.delete(key(cur.x,cur.y));l.objects.set(key(next.x,next.y),'chicken');cur=next;renderAll();const em=getCell(next.x,next.y)?.querySelector('.emoji');em?.classList.add('chickenHop');setTimeout(step,190)};setTimeout(step,220)}
function findAgentPath(start,goal){const l=state.level,q=[start],came=new Map([[key(start.x,start.y),null]]);while(q.length){const cur=q.shift();if(cur.x===goal.x&&cur.y===goal.y)break;for(const[dx,dy]of dirs){const nx=cur.x+dx,ny=cur.y+dy,nk=key(nx,ny);if(came.has(nk)||!isFloor(nx,ny)||isMachineCell(nx,ny))continue;if(l.objects.has(nk)&&!(nx===goal.x&&ny===goal.y))continue;came.set(nk,cur);q.push({x:nx,y:ny})}}const gk=key(goal.x,goal.y);if(!came.has(gk))return[];const path=[];let c=goal;while(!(c.x===start.x&&c.y===start.y)){path.unshift(c);c=came.get(key(c.x,c.y))}return path}

function checkTntIgnition(){const l=state.level;let tnt=null,candle=null;for(const[k,id]of l.objects){const[ox,oy]=k.split(',').map(Number);if(id==='tnt')tnt={x:ox,y:oy};if(id==='candle')candle={x:ox,y:oy}}if(!tnt||!candle||!isAdjacent(tnt.x,tnt.y,candle.x,candle.y))return;state.busy=true;const ce=getCell(candle.x,candle.y)?.querySelector('.emoji');if(ce){ce.classList.add('candleFly');ce.style.setProperty('--dx',`${(tnt.x-candle.x)*100}%`);ce.style.setProperty('--dy',`${(tnt.y-candle.y)*100}%`)}setTimeout(()=>{l.objects.delete(key(candle.x,candle.y));renderBoard();const te=getCell(tnt.x,tnt.y)?.querySelector('.emoji');te?.classList.add('tntPulse');setTimeout(()=>explodeTnt(tnt.x,tnt.y),620)},280)}
function explodeTnt(x,y){const l=state.level;l.objects.delete(key(x,y));renderBoard();spawnEffect(x,y,'💥','boomCenter',300);setTimeout(()=>{dirs.forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,nk=key(nx,ny);spawnEffect(nx,ny,'💥','boomOuter',460);if(l.breakables.has(nk)){l.breakables.delete(nk);l.floors.add(nk);l.caveOpened=true}});setTimeout(()=>{if(l.caveOpened&&l.def.caveReward){const[rx,ry,id]=l.def.caveReward;if(!l.objects.has(key(rx,ry)))l.objects.set(key(rx,ry),id)}state.busy=false;renderAll();say('💥',500)},440)},145)}
function spawnEffect(x,y,emoji,cls,duration){const cell=getCell(x,y);if(!cell)return;const s=document.createElement('span');s.className=`fx ${cls||''}`;s.textContent=emoji;cell.appendChild(s);setTimeout(()=>s.remove(),duration||400)}
function getCell(x,y){return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`)}
function nextLevel(){if(state.levelIndex<LEVELS.length-1)loadLevel(state.levelIndex+1,true);else finishGame()}
function finishGame(){state.busy=true;const inv=Object.entries(state.inventory).map(([id,n])=>`${emojiOf(id)}${n>1?'×'+n:''}`).join(' ');$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">🚪✨</div><div class="modalTitle">SIX ROOMS ESCAPED</div><div class="modalText">${inv?`You finished with ${inv}`:'You made it out.'}</div><button class="primary" id="again">PLAY AGAIN</button></div></div>`;setTimeout(()=>{$('#again').onclick=()=>{state.inventory={};$('#overlayRoot').innerHTML='';state.busy=false;loadLevel(0,false)}},650)}
function showHelp(){$('#overlayRoot').innerHTML=`<div class="modal"><div class="modalCard"><div class="modalBig">🙂</div><div class="modalTitle">ESCAPE</div><div class="helpText">Move with the arrows.<br><br>Walk over emoji to collect them. Tap inventory items to use them in the room.<br><br>Escape each room.</div><button class="primary" id="helpClose">PLAY</button></div></div>`;$('#helpClose').onclick=()=>$('#overlayRoot').innerHTML=''}

function jumpLevel(delta){
  const ni=(state.levelIndex+delta+LEVELS.length)%LEVELS.length;
  if(ni===3){if(!hasInv('tnt'))state.inventory.tnt=1;if(!hasInv('candle'))state.inventory.candle=1}
  if(ni===4&&!hasInv('glasses'))state.inventory.glasses=1;
  if(ni===5&&!hasInv('pin'))state.inventory.pin=1;
  loadLevel(ni,true);say(`ROOM ${ni+1}`,450)
}
document.querySelectorAll('.dpad button[data-move]').forEach(btn=>{
  let delayTimer=null,repeatTimer=null,activePointer=null;
  const stop=()=>{if(delayTimer)clearTimeout(delayTimer);if(repeatTimer)clearInterval(repeatTimer);delayTimer=repeatTimer=null;activePointer=null};
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();stop();activePointer=e.pointerId;try{btn.setPointerCapture(e.pointerId)}catch(_){ }
    const[dx,dy]=btn.dataset.move.split(',').map(Number);if(!state.busy)moveOne(dx,dy);
    delayTimer=setTimeout(()=>{repeatTimer=setInterval(()=>{if(!state.busy)moveOne(dx,dy)},115)},260);
  });
  ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>btn.addEventListener(ev,e=>{if(activePointer===null||e.pointerId===activePointer)stop()}));
  btn.addEventListener('click',e=>e.preventDefault());
});
$('#resetBtn').addEventListener('click',resetRoom);$('#helpBtn').addEventListener('click',showHelp);$('#prevLevel').addEventListener('click',()=>jumpLevel(-1));$('#nextLevel').addEventListener('click',()=>jumpLevel(1));window.addEventListener('resize',()=>{sizeBoard();renderBoard()});window.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(m[e.key]){e.preventDefault();moveOne(...m[e.key])}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#app'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('#app'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.closest('#app'))e.preventDefault()});
loadLevel(0,false);
})();
</script>
