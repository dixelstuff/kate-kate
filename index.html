  @media(prefers-reduced-motion:reduce){

</style>

  function el(tag,className){

    var node = document.createElementNS('http://www.w3.org/2000/svg',tag);
    Object.keys(attributes || {}).forEach(function(name){
      node.setAttribute(name,attributes[name]);
    });
    return node;
  }

  function cleanCrop(item){
    var supplied = item.crop || {};
    var crop = {
      top:Math.max(0,Number(supplied.top) || 0),
      right:Math.max(0,Number(supplied.right) || 0),
      bottom:Math.max(0,Number(supplied.bottom) || 0),
      left:Math.max(0,Number(supplied.left) || 0)
    };
    if (crop.left + crop.right >= 100) crop.left = crop.right = 0;
    if (crop.top + crop.bottom >= 100) crop.top = crop.bottom = 0;
    return crop;
  }

  function setThumbFocus(image,item){
    var crop = cleanCrop(item);
    var x = crop.left + (100 - crop.left - crop.right) / 2;
    var y = crop.top + (100 - crop.top - crop.bottom) / 2;
    image.style.objectPosition = x + '% ' + y + '%';
  }

       In a CSS grid that can become an anonymous first grid item. */
    grid.replaceChildren();

    items.forEach(function(item,index){
      var button = el('button','cxrt-card');
      var thumb = el('span','cxrt-thumb');
      var image = document.createElement('img');
      var number = el('span','cxrt-number');
      var name = el('span','cxrt-name');

      button.type = 'button';
      button.dataset.index = index;
      button.setAttribute('aria-label',(index + 1) + '. ' + item.name + '. Enlarge image.');
      image.src = item.image;
      image.alt = '';
      image.loading = 'lazy';
      image.draggable = false;
      setThumbFocus(image,item);
      image.style.setProperty('--cxrt-image-filter',item.imageFilter || 'none');
      number.textContent = ('0' + (index + 1)).slice(-2);
      name.textContent = item.name;

      thumb.appendChild(image);
      thumb.appendChild(number);
      button.appendChild(thumb);
      button.appendChild(name);
      grid.appendChild(button);
    });
  }

  function buildAnnotations(item){
    var old = imageFrame.querySelector('.cxrt-annotations');
    if (old) old.remove();
    if (!item.annotations || !item.annotations.length) return;

    var crop = cleanCrop(item);
    var cropWidth = 100 - crop.left - crop.right;
    var cropHeight = 100 - crop.top - crop.bottom;
    var layer = svgEl('svg',{
      'class':'cxrt-annotations',
      'viewBox':'0 0 100 100',
      'preserveAspectRatio':'none',
      'aria-hidden':'true'
    });

    item.annotations.forEach(function(annotation){
      var displayX = (annotation.x - crop.left) / cropWidth * 100;
      var displayY = (annotation.y - crop.top) / cropHeight * 100;
      var group = svgEl('g',{
        'transform':'translate(' + displayX + ' ' + displayY + ') rotate(' + annotation.angle + ')'
      });
      var shape = svgEl('g',{
        'transform':'scale(' + (annotation.size * 100 / cropWidth / 237.64) + ')'
      });
      var path = svgEl('path',{
        'd':'M7.954,226.53c-2.23,4.623-2.295,8.072-0.609,9.915c3.911,4.275,15.926-3.905,23.323-9.051l58.416-40.662c7.397-5.145,20.402-11.835,29.414-11.993c0.897-0.016,1.8-0.011,2.703,0.011c9.007,0.218,21.958,7.016,29.3,12.238l56.403,40.151c7.343,5.221,19.303,13.473,23.301,9.219c1.74-1.849,1.751-5.33-0.381-9.997L129.648,7.047c-4.264-9.333-11.335-9.404-15.79-0.163L7.954,226.53z',
        'transform':'translate(-118.82 0)',
        'fill':annotation.color || '#f4d03f'
      });
      shape.appendChild(path);
      group.appendChild(shape);
      layer.appendChild(group);
    });

    imageFrame.appendChild(layer);
  }

  function positionLargeImage(item){
    if (!largeImage.naturalWidth || !largeImage.naturalHeight) return;
    var crop = cleanCrop(item);
    var cropWidth = 100 - crop.left - crop.right;
    var cropHeight = 100 - crop.top - crop.bottom;
    var ratio = (largeImage.naturalWidth * cropWidth) / (largeImage.naturalHeight * cropHeight);
    var compact = window.innerWidth <= 760;
    var canvasSize = Math.max(160,Math.min(
      560,
      window.innerWidth - (compact ? 38 : 120),
      window.innerHeight - (compact ? 262 : 240)
    ));
    var frameWidth = ratio >= 1 ? canvasSize : canvasSize * ratio;
    var frameHeight = ratio >= 1 ? canvasSize / ratio : canvasSize;

    stage.style.width = canvasSize + 'px';
    controls.style.width = canvasSize + 'px';
    caption.style.width = canvasSize + 'px';
    imageFrame.style.width = frameWidth + 'px';
    imageFrame.style.height = frameHeight + 'px';
    imageFrame.style.left = ((canvasSize - frameWidth) / 2) + 'px';
    imageFrame.style.top = ((canvasSize - frameHeight) / 2) + 'px';
    largeImage.style.width = (10000 / cropWidth) + '%';
    largeImage.style.height = 'auto';
    largeImage.style.left = (-crop.left / cropWidth * 100) + '%';
    largeImage.style.top = (-crop.top / cropHeight * 100) + '%';
    buildAnnotations(item);
  }

  function show(index){
    current = (index + items.length) % items.length;
    var item = items[current];
    var oldLayer = imageFrame.querySelector('.cxrt-annotations');
    if (oldLayer) oldLayer.remove();

    count.textContent = (current + 1) + ' of ' + items.length;
    title.textContent = item.name;
    description.textContent = item.description;
    source.href = item.source;
    source.textContent = (item.showAuthor === false ? '' : item.author + ', ') + 'rID ' + item.rid;
    largeImage.alt = item.name + ' chest X-ray example';
    largeImage.style.setProperty('--cxrt-image-filter',item.imageFilter || 'none');
    largeImage.onload = function(){ positionLargeImage(item); };
    largeImage.src = item.image;
    if (largeImage.complete) positionLargeImage(item);
  }

  function openLightbox(index,button){
    returnFocus = button || document.activeElement;
    lightbox.hidden = false;
    document.body.classList.add('cxrt-modal-open');
    show(index);
    window.setTimeout(function(){ dialog.focus(); },0);
  }

  function shut(){
    lightbox.hidden = true;
    document.body.classList.remove('cxrt-modal-open');
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  }

  previous.addEventListener('click',function(){ show(current - 1); });
  next.addEventListener('click',function(){ show(current + 1); });
  close.addEventListener('click',shut);
  lightbox.addEventListener('click',function(event){
    if (event.target === lightbox) shut();
  });
  grid.addEventListener('click',function(event){
    var button = event.target.closest('.cxrt-card');
    if (!button) return;
    event.preventDefault();
    openLightbox(Number(button.dataset.index),button);
  });
  window.addEventListener('resize',function(){
    if (!lightbox.hidden) positionLargeImage(items[current]);
  });
  document.addEventListener('keydown',function(event){
    if (lightbox.hidden) return;
    if (event.key === 'Escape') shut();
    if (event.key === 'ArrowLeft') show(current - 1);
    if (event.key === 'ArrowRight') show(current + 1);
  });

  buildGrid();
})();
</script>
